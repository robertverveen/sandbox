# Edge-proxy voor de hele server (HZW-003): Caddy met automatische TLS op 80/443, routeert naar de instanties op
# het netwerk hz-edge. Eén per server; deploy.sh start of herlaadt hem bij elke uitrol.
#
#   docker compose -p hz-edge --env-file /etc/hz/hz.env --env-file /run/hz/edge.env -f compose/edge.yaml up -d
name: hz-edge

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      HZ_DOMAIN: ${HZ_DOMAIN:?HZ_DOMAIN ontbreekt in /etc/hz/hz.env}
      HZ_TEST_DOMAIN: ${HZ_TEST_DOMAIN:?}
      HZ_ERRORS_DOMAIN: ${HZ_ERRORS_DOMAIN:?}
      HZ_ACME_EMAIL: ${HZ_ACME_EMAIL:?}
      HZ_PREVIEW_USER: ${HZ_PREVIEW_USER:-hz}
      HZ_PREVIEW_HASH: ${HZ_PREVIEW_HASH:?bcrypt-hash van het previewwachtwoord (caddy hash-password)}
    volumes:
      # Een vaste map (deploy.sh kopieert de Caddyfile uit de uitrolbundel erheen en herlaadt zonder onderbreking).
      - ${HZ_EDGE_DIR:-../caddy}:/etc/caddy:ro
      - ${HZ_PREVIEWS_ALLOW_DIR:-/opt/hz/previews/allow}:/srv/previews:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/healthz']
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: local
      options: { max-size: 20m, max-file: '5' }

volumes:
  # Certificaten en ACME-account: verliezen is niet erg (Caddy vraagt opnieuw aan), maar zit wel in de back-up.
  caddy-data: {}
  caddy-config: {}

networks:
  edge:
    external: true
    name: hz-edge
