# Eén instantie van de HomeZero Workspace (HZW-004/005): productie (hz-prod), test (hz-test) of een preview
# per pull request (hz-pr-<nr>). deploy.sh en preview.sh starten dit bestand met:
#
#   docker compose -p <instantie> --env-file /etc/hz/hz.env --env-file <secrets> -f compose/app.yaml up -d
#
# Variabelen (interpolatie): uit /etc/hz/hz.env (niet geheim), de ontsleutelde secrets in /run/hz (geheim) en wat
# deploy.sh zelf zet (HZ_INSTANCE, HZ_TAG, HZ_PUBLIC_URL, HZ_APP_ENV_FILE). api en worker krijgen alleen de
# app-secrets (HZ_APP_ENV_FILE, zonder databasewachtwoorden); de database krijgt alleen zijn eigen wachtwoorden.
name: ${HZ_INSTANCE:?HZ_INSTANCE ontbreekt}

x-app-image: &app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: local
    options: { max-size: 10m, max-file: '5' }

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HZ_PG_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: hz
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      HZ_PG_MIGRATOR_PASSWORD: ${HZ_PG_MIGRATOR_PASSWORD:?}
      HZ_PG_APP_PASSWORD: ${HZ_PG_APP_PASSWORD:?}
      HZ_PG_BACKUP_PASSWORD: ${HZ_PG_BACKUP_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../postgres/hz-roles.sh:/docker-entrypoint-initdb.d/10-hz-roles.sh:ro
      - ../../packages/db/sql:/hz-sql:ro
    # Geen gepubliceerde poort: alleen api, worker en migrate (zelfde netwerk) en back-ups via docker exec.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hz']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    logging:
      driver: local
      options: { max-size: 10m, max-file: '5' }

  migrate:
    <<: *app
    image: ${HZ_REGISTRY:?}/hz-api:${HZ_TAG:?}
    restart: 'no'
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: postgres://hz_migrator:${HZ_PG_MIGRATOR_PASSWORD}@db:5432/hz
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    image: ${HZ_REGISTRY}/hz-api:${HZ_TAG}
    env_file: ['${HZ_APP_ENV_FILE:?HZ_APP_ENV_FILE ontbreekt}']
    environment:
      NODE_ENV: ${HZ_NODE_ENV:-production}
      HZ_ENVIRONMENT: ${HZ_ENVIRONMENT:?}
      HZ_RELEASE: ${HZ_TAG}
      HZ_STORE: db
      HZ_API_HOST: 0.0.0.0
      HZ_API_PORT: '8700'
      HZ_PUBLIC_URL: ${HZ_PUBLIC_URL:?}
      HZ_WEB_ORIGIN: ${HZ_PUBLIC_URL}
      HZ_FIXTURE_SET: ${HZ_FIXTURE_SET:-demo}
      HZ_DEV_LOGIN: ${HZ_DEV_LOGIN:-0}
      DATABASE_URL: postgres://hz_app_login:${HZ_PG_APP_PASSWORD}@db:5432/hz
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8700/api/health').then(r=>r.json()).then(j=>process.exit(j.ok&&j.db!=='error'?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *app
    image: ${HZ_REGISTRY}/hz-worker:${HZ_TAG}
    env_file: ['${HZ_APP_ENV_FILE}']
    environment:
      NODE_ENV: ${HZ_NODE_ENV:-production}
      HZ_ENVIRONMENT: ${HZ_ENVIRONMENT}
      HZ_RELEASE: ${HZ_TAG}
      HZ_FIXTURE_SET: ${HZ_FIXTURE_SET:-demo}
      HZ_WORKER_HEARTBEAT: /tmp/hz-worker-alive
      DATABASE_URL: postgres://hz_app_login:${HZ_PG_APP_PASSWORD}@db:5432/hz
      # pg-boss in een eigen schema met de migratierol (eigenaar van de database).
      HZ_BOSS_DATABASE_URL: postgres://hz_migrator:${HZ_PG_MIGRATOR_PASSWORD}@db:5432/hz
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'node', 'dist/ops-cli.js', 'heartbeat-ok']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    <<: *app
    image: ${HZ_REGISTRY}/hz-web:${HZ_TAG}
    environment:
      HZ_API_UPSTREAM: api:8700
    depends_on:
      api: { condition: service_healthy }
    networks:
      default: {}
      edge:
        # De edge-proxy vindt elke instantie op <instantie>-web (zie infra/caddy/Caddyfile).
        aliases: ['${HZ_INSTANCE}-web']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  db-data: {}

networks:
  default: {}
  edge:
    external: true
    name: hz-edge
