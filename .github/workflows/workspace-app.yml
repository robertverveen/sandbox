# CI van de HomeZero Workspace-app (HZW-001). De git-root is deze map; de app staat in workspace-app/.
name: workspace-app
on:
  pull_request:
    paths: ['workspace-app/**', '.github/workflows/workspace-app.yml']
  push:
    branches: [main]
    paths: ['workspace-app/**', '.github/workflows/workspace-app.yml']

defaults:
  run:
    working-directory: workspace-app

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        # Superuser is 'postgres'. hz_dev (de migratierol) wordt hieronder aangemaakt ZONDER SUPERUSER,
        # anders omzeilt elke query RLS en faalt de RLS-test (rolsuper=false).
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: workspace-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workspace-app/pnpm-lock.yaml
      - name: Rollen in Postgres (hz_dev zonder superuser, hz_app, hz_indexer, hz_worker en hz_auth, logins voor app, auth, indexer, worker en pg-boss)
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE hz_dev LOGIN PASSWORD 'hz_dev' CREATEDB NOSUPERUSER NOCREATEROLE NOBYPASSRLS"
          psql -h localhost -U postgres -v migrator=hz_dev -f packages/db/sql/bootstrap-roles.sql
          psql -h localhost -U postgres -v login=hz_app_login -v password=hz_app_login -f packages/db/sql/app-login.sql
          psql -h localhost -U postgres -v login=hz_indexer_login -v password=hz_indexer_login -f packages/db/sql/indexer-login.sql
          psql -h localhost -U postgres -v login=hz_worker_login -v password=hz_worker_login -f packages/db/sql/worker-login.sql
          psql -h localhost -U postgres -v login=hz_auth_login -v password=hz_auth_login -f packages/db/sql/auth-login.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE hz_ci_boss OWNER hz_dev"
          psql -h localhost -U postgres -d hz_ci_boss -v login=hz_boss -v password=hz_boss_test -v schema=pgboss -f packages/db/sql/boss-login.sql
          psql -h localhost -U postgres -tAc "select rolname, rolsuper, rolbypassrls, rolinherit from pg_roles where rolname in ('hz_dev', 'hz_app', 'hz_app_login', 'hz_indexer', 'hz_indexer_login', 'hz_worker', 'hz_worker_login', 'hz_auth', 'hz_auth_login', 'hz_boss')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Infra-tests (stuk E0): back-up/herstel versleutelen met age, scripts door shellcheck, router en site-blok
      # van de proxy echt in Caddy.
      - name: Infra-gereedschap (age, shellcheck, caddy)
        env:
          CADDY_VERSION: 2.10.2
          # sha256 van caddy_2.10.2_linux_amd64.tar.gz (nagerekend tegen de sha512 in caddy_2.10.2_checksums.txt van
          # de release). Andere versie = ook deze waarde bijwerken; zonder overeenkomst stopt de job.
          CADDY_SHA256: 5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends age shellcheck
          curl -fsSL -o "$RUNNER_TEMP/caddy.tar.gz" "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "${CADDY_SHA256}  $RUNNER_TEMP/caddy.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C /usr/local/bin caddy
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
