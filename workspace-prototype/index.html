    if (act === 'extract-scan') return runExtraction('scan');
    if (act === 'extract-m') return runExtraction('meeting', id);
    if (act === 'skip-m') { closeSheet(); return markRead({ type: 'rec', rawId: id, id: 'wm:' + id }); }
    if (act === 'recap') { const x = byId(id); if (x) recapWithClaude(x); return; }
    if (act === 'sweep') return sweep();
    if (act === 'import-canvas') return importCanvas();
    if (act === 'import-goals') return importWeekgoals();
    if (act === 'swipe') return startSwipe();
    if (act === 'plan-tab') { S.planTab = a.dataset.tab; S.fIdx = 0; S.fId = null; return render(); }
    if (act === 'go-sprint') { S.planTab = 'sprint'; return go({ view: 'planning' }); }
    if (act === 'toggle-inbox') { S.showInbox = !a.parentElement.open; store.set('showInbox', S.showInbox); return; }
    if (act === 'toggle-brief') { S.briefOpen = !a.parentElement.open; return; }
    if (act === 'swipe-key') return swipeKey(a.dataset.key);
    if (act === 'swipe-stop') { const g = a.dataset.goAfter; stopSwipe(); if (g) go({ view: g }); return; }
    if (act === 'cal-panel') { S.calPanel = !S.calPanel; return render(); }
    if (act === 'cal-group') { const cs = LV.calendars.filter(c => calGroup(c) === a.dataset.group); const anyOn = cs.some(c => calOn(c.id)); cs.forEach(c => S.calPrefs[c.id] = { ...calPref(c.id), on: !anyOn }); store.set('calPrefs', S.calPrefs); if (MODE.live) ensureCalRange(calRangeStart(), 35); return render(); }
    if (act === 'cal-group-scope') { const cs = LV.calendars.filter(c => calGroup(c) === a.dataset.group); const allAgenda = cs.every(c => !calEverywhere(c.id)); cs.forEach(c => S.calPrefs[c.id] = { ...calPref(c.id), scope: allAgenda ? 'overal' : 'agenda' }); store.set('calPrefs', S.calPrefs); return render(); }
    if (act === 'planner') return openPlanner();
    if (act === 'planner-close') { S.planner = null; return render(); }
    if (act === 'planner-person') { const P = S.planner; const e = a.dataset.email; P.people = P.people.includes(e) ? P.people.filter(x => x !== e) : [...P.people, e]; P.sel = null; return plannerSuggest(); }
    if (act === 'planner-slot') { const s = S.planner?.slots[+a.dataset.i]; if (s) plannerPick(s.start); return; }
    if (act === 'planner-send') return plannerSend();
    if (act === 'cal-toggle') { S.calPrefs[id] = !calOn(id); store.set('calPrefs', S.calPrefs); if (MODE.live) ensureCalRange(calRangeStart(), 35); return render(); }
    if (act === 'refresh') { CAP.mcp?.invalidate().catch(() => {}); return toast(`${ic('refresh')} Bronnen worden ververst`); }
    if (act === 'retry') { const e = ST[a.dataset.key]; if (e?.retry) { ST[a.dataset.key] = 'loading'; render(); e.retry(); } return; }
    if (act === 'src-err') { const s = sourceState(SOURCES[+a.dataset.i]); return toast(esc(errText(s.err))); }
  }
  const pcol = t.closest('.wk-col.picking');
  if (pcol && S.planner && !t.closest('.wk-ev, .wk-slot, .wk-sel')) {
    const g = S.agendaGrid; const y = ev.clientY - pcol.getBoundingClientRect().top;
    const mins = Math.max(0, Math.round((y / g.PX * 60) / 15) * 15) + g.H0 * 60;
    const d = pd(pcol.dataset.date); d.setHours(Math.floor(mins / 60), mins % 60, 0, 0); return plannerPick(d);
  }
  const ent = t.closest('[data-entity]'); if (ent) { ev.stopPropagation(); go({ view: 'entity', id: ent.dataset.entity }); return; }
  const g = t.closest('[data-go]');
  if (g) {
    const k = g.dataset.go;
    if (k.startsWith('o-')) return go({ view: 'entity', id: k.slice(2) });
    location.hash === '#' + k ? (S.route = routeFromHash(), render()) : (location.hash = k);
    document.getElementById('app').classList.remove('nav-open');
    return;
  }
  const tab = t.closest('[data-ctab]'); if (tab) { S.commitTab = tab.dataset.ctab; S.fIdx = 0; S.fId = null; return render(); }
  const kr = t.closest('#main [data-k]'); if (kr) { const rows = [...document.querySelectorAll('#main [data-k]')]; S.fIdx = rows.indexOf(kr); S.fId = kr.dataset.k; applyFocus(); }
  const o = t.closest('[data-open]'); if (o && o.dataset.open) return openItem(o.dataset.open);
  const ch = t.closest('[data-chat]'); if (ch) { S.chatChannel = ch.dataset.chat; return render(); }
  const co = t.closest('[data-chat-open]'); if (co) { S.chatChannel = co.dataset.chatOpen; S.selected = null; return go({ view: 'chat' }); }
  const md = t.closest('[data-mode]'); if (md) { S.chatChannel = md.dataset.mode === 'ai' ? 'ai' : 'all'; return render(); }
  if (document.getElementById('app').classList.contains('nav-open') && !t.closest('.sidebar')) document.getElementById('app').classList.remove('nav-open');
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.calOn) return setCal(t.dataset.calOn, { on: t.checked });
  if (t.dataset.calColor) return setCal(t.dataset.calColor, { color: t.value });
  if (t.dataset.calScope) return setCal(t.dataset.calScope, { scope: t.checked ? 'overal' : 'agenda' });
  if (t.id === 'pl-dur' && S.planner) { S.planner.dur = +t.value; if (S.planner.sel) S.planner.sel.end = new Date(+S.planner.sel.start + S.planner.dur * 6e4); return plannerSuggest(); }
  if (t.id === 'pl-meet' && S.planner) S.planner.meet = t.checked;
});
document.addEventListener('input', ev => { if (ev.target.id === 'pl-title' && S.planner) S.planner.title = ev.target.value; });
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  if (ev.target.id === 'addcommit') {
    const wat = document.getElementById('ac-wat').value.trim(); if (!wat) return;
    const stroom = document.getElementById('ac-stroom').value;
    await commitAdd({ wat, stroom, org: document.getElementById('ac-org').value.trim(), deadline: document.getElementById('ac-date').value || null, week: stroom === 'weekdoel' ? isoWeek(baseDay()) : null, reminder: stroom === 'aan_mij' ? ymd(addWorkdays(S.clock, 3)) : null });
    S.commitTab = stroom;
    document.getElementById('ac-wat').value = ''; document.getElementById('ac-org').value = ''; document.activeElement?.blur?.();
    toast(`${ic('commit')} Toegevoegd${['mijn', 'voornemen'].includes(stroom) ? ': plan hem met 1–5' : ''}`);
    mainDirty = false; render();
  }
  if (ev.target.id === 'composer') { const inp = document.getElementById('composer-input'); const v = inp.value.trim(); if (v && S.chatChannel === 'ai') ask(v); }
});

S.route = routeFromHash();
boot();
</script>
