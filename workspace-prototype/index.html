<title>Home Zero Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: macOS-style three panes — sidebar (bronnen, views, partners) | werkvlak | contextpaneel. ⌘K-palet zweeft erboven. */
:root {
  --bg: #F4F6F3;
  --panel: #FFFFFF;
  --sidebar: #ECEFEA;
  --fg: #18211C;
  --muted: #59645D;
  --faint: #879189;
  --line: #DCE1DA;
  --hover: #E5E9E3;
  --accent: #1D6A4C;
  --accent-fg: #FFFFFF;
  --accent-soft: #DDEFE5;
  --warn: #A85A0B;
  --warn-soft: #FBEBD6;
  --add: #E3F4E8;
  --del: #FBE4E1;
  --c-mail: #C2410C;
  --c-slack: #7B3A82;
  --c-meeting: #2F5FD0;
  --c-context: #1D6A4C;
  --c-task: #A86B12;
  --c-file: #0E7490;
  --shadow: 0 24px 60px -12px rgba(20, 35, 27, .28), 0 0 0 1px rgba(20, 35, 27, .06);
  --font-ui: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --panel: #161B18; --sidebar: #0C0F0D; --fg: #E5EBE6; --muted: #9DA7A0; --faint: #6E7972;
    --line: #262E29; --hover: #1E2521; --accent: #5BC394; --accent-fg: #0C1410; --accent-soft: #183327;
    --warn: #F0A848; --warn-soft: #33250F; --add: #16301F; --del: #3A1C19;
    --c-mail: #F08A5D; --c-slack: #C98BD0; --c-meeting: #7FA2F2; --c-context: #5BC394; --c-task: #E4B355; --c-file: #4CC3DB;
    --shadow: 0 24px 60px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --panel: #161B18; --sidebar: #0C0F0D; --fg: #E5EBE6; --muted: #9DA7A0; --faint: #6E7972;
  --line: #262E29; --hover: #1E2521; --accent: #5BC394; --accent-fg: #0C1410; --accent-soft: #183327;
  --warn: #F0A848; --warn-soft: #33250F; --add: #16301F; --del: #3A1C19;
  --c-mail: #F08A5D; --c-slack: #C98BD0; --c-meeting: #7FA2F2; --c-context: #5BC394; --c-task: #E4B355; --c-file: #4CC3DB;
  --shadow: 0 24px 60px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-size: 12px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* App shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }
.app.has-inspector { grid-template-columns: 236px minmax(0, 1fr) 360px; }

.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: 10px; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 14px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: -.02em; }
.brand b { font-weight: 600; font-size: 14px; }
.brand div span { display: block; font-size: 11px; color: var(--faint); }
.searchbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; color: var(--faint); margin-bottom: 14px; }
.searchbtn:hover { color: var(--muted); }
.searchbtn > span:not(.kbd) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.searchbtn .kbd { margin-left: auto; }
.kbd { font-family: var(--font-mono); font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--bg); line-height: 18px; }
.nav { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.nav-group { display: flex; flex-direction: column; gap: 1px; }
.nav-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 0 9px 4px; display: flex; justify-content: space-between; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 5px 9px; border-radius: 7px; color: var(--muted); text-align: left; width: 100%; }
.nav-item:hover { background: var(--hover); color: var(--fg); }
.nav-item.active { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--line); font-weight: 500; }
.nav-item .count { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav-item .count.hot { color: var(--warn); font-weight: 600; }
.nav-item .q { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); margin-left: auto; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sources { border-top: 1px solid var(--line); padding: 10px 9px 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--faint); }
.sources .sd { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.main { min-width: 0; min-height: 0; overflow-y: auto; background: var(--bg); }
.topbar { display: none; }
.page { padding-block: 26px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1180px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.eyebrow { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 2px 0 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); }

.inspector { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; padding-block: 18px 40px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Shared bits */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.card-body { padding: 12px 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.chip.entity { background: var(--accent-soft); color: var(--accent); font-weight: 500; cursor: pointer; }
.chip.entity:hover { filter: brightness(.97); }
.chip.warn { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.chip.ok { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip.plan { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; }
.src-mail { color: var(--c-mail); } .src-slack { color: var(--c-slack); } .src-meeting { color: var(--c-meeting); }
.src-context { color: var(--c-context); } .src-task { color: var(--c-task); } .src-file { color: var(--c-file); }
.ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--hover); }
.ic.mail { color: var(--c-mail); } .ic.slack { color: var(--c-slack); } .ic.meeting { color: var(--c-meeting); }
.ic.context { color: var(--c-context); } .ic.task { color: var(--c-task); } .ic.file { color: var(--c-file); }
.row { display: flex; align-items: flex-start; gap: 11px; padding: 9px 10px; border-radius: 9px; cursor: pointer; text-align: left; width: 100%; }
.row:hover, .row.sel { background: var(--hover); }
.row-main { min-width: 0; flex: 1; }
.row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-title.unread::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c-meeting); margin-right: 7px; vertical-align: 1px; }
.row-sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 1px; }
.list { display: flex; flex-direction: column; gap: 1px; }
.group-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 14px 10px 4px; display: flex; align-items: center; gap: 8px; }
.group-label:first-child { padding-top: 4px; }
.empty { color: var(--faint); padding: 20px 10px; text-align: center; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; color: #fff; }

/* Vandaag */
.banner { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--fg); margin-bottom: 18px; flex-wrap: wrap; }
.banner .ic { background: var(--panel); color: var(--warn); }
.banner .row-main { min-width: 200px; }
.timeline { position: relative; padding: 6px 14px 12px 58px; }
.tl-hour { position: relative; height: 46px; border-top: 1px solid var(--line); }
.tl-hour span { position: absolute; left: -46px; top: -8px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; width: 38px; text-align: right; }
.tl-event { position: absolute; left: 58px; right: 14px; border-radius: 8px; padding: 6px 10px; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 2px; border-left: 3px solid var(--c-meeting); background: color-mix(in srgb, var(--c-meeting) 10%, var(--panel)); }
.tl-event:hover { background: color-mix(in srgb, var(--c-meeting) 16%, var(--panel)); }
.tl-event.past { opacity: .78; }
.tl-event.short { flex-direction: row; align-items: center; gap: 10px; padding-block: 2px; }
.tl-event b { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-event .t { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.now-line { position: absolute; left: 50px; right: 6px; height: 0; border-top: 2px solid var(--c-mail); z-index: 2; }
.now-line::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--c-mail); }
.brief li { margin-bottom: 6px; }
.brief { margin: 0; padding-left: 18px; color: var(--fg); }

/* Agenda */
.week { display: grid; grid-template-columns: 48px repeat(5, minmax(120px, 1fr)); min-width: 680px; }
.week-wrap { overflow-x: auto; }
.wk-head { padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.wk-head b { display: block; font-size: 18px; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.wk-head.today b { color: var(--accent); }
.wk-col { position: relative; border-left: 1px solid var(--line); }
.wk-hours { position: relative; }
.wk-hl { height: 44px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--faint); text-align: right; padding-right: 6px; font-variant-numeric: tabular-nums; }
.wk-ev { position: absolute; left: 4px; right: 4px; border-radius: 7px; padding: 4px 7px; font-size: 12px; cursor: pointer; overflow: hidden; border-left: 3px solid var(--c-meeting); background: color-mix(in srgb, var(--c-meeting) 11%, var(--panel)); }
.wk-ev b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-ev .state { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.wk-ev.pending { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.wk-ev.done { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Meeting page */
.meta-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
.people { display: flex; gap: 6px; flex-wrap: wrap; }
.person { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 9px 2px 2px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.person .avatar { width: 20px; height: 20px; font-size: 9px; }
.wb-section { padding: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.wb-section:first-child { border-top: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check .who { color: var(--faint); font-size: 12px; white-space: nowrap; }
.diff { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.diff-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.diff pre { margin: 0; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.diff .ln { display: block; padding: 0 10px; white-space: pre; }
.diff .ln.add { background: var(--add); }
.diff .ln.del { background: var(--del); text-decoration: line-through; color: var(--muted); }
.diff .ln.ctx { color: var(--muted); }
.committed { display: flex; gap: 12px; align-items: center; padding: 14px; background: var(--accent-soft); border-radius: 12px; color: var(--fg); flex-wrap: wrap; }
.committed .ic { background: var(--panel); color: var(--accent); }
.answer-q { background: var(--bg); border-radius: 9px; padding: 9px 11px; font-size: 13px; }

/* Entity */
.entity-hero { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.entity-logo { width: 52px; height: 52px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 20px; font-weight: 700; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.facts dt { color: var(--faint); }
.facts dd { margin: 0; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.count-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
.count-pill b { font-variant-numeric: tabular-nums; }
.repo-path { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

/* Chat */
.chat { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100%; min-height: 0; }
.chat-list { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 8px; background: var(--bg); }
.chat-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.chat-head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.msgs { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; max-width: 760px; }
.msg-body { min-width: 0; }
.msg-meta { font-size: 12px; color: var(--faint); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msg-meta b { color: var(--fg); font-size: 13.5px; font-weight: 600; }
.msg-text { margin-top: 2px; overflow-wrap: anywhere; }
.msg.ai .avatar { background: var(--accent); color: var(--accent-fg); }
.msg.ai .msg-text { background: var(--accent-soft); padding: 10px 12px; border-radius: 4px 12px 12px 12px; }
.msg.ai .msg-text ul { margin: 6px 0; padding-left: 18px; }
.sources-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.composer { border-top: 1px solid var(--line); padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 8px; }
.composer-box { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; background: var(--bg); }
.composer-box textarea { flex: 1; border: 0; background: transparent; resize: none; outline: none; min-height: 22px; max-height: 120px; }
.seg { display: inline-flex; background: var(--hover); border-radius: 8px; padding: 2px; }
.seg button { padding: 3px 10px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }
.mention { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 3px; font-weight: 500; cursor: pointer; }

/* Query bar + list view */
.qbar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; margin-bottom: 16px; }
.qbar input { flex: 1; border: 0; outline: none; background: transparent; font-family: var(--font-mono); font-size: 13px; min-width: 0; }
.tok { font-family: var(--font-mono); font-size: 12px; }
.tok-key { color: var(--accent); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 14px; }

/* Activity */
.quickadd { display: flex; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; align-items: center; margin-bottom: 8px; }
.quickadd input { flex: 1; border: 0; outline: none; background: transparent; min-width: 0; }
.hint { font-size: 12px; color: var(--faint); margin: 0 0 18px; }

/* Inspector */
.insp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.insp-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 6px 0 4px; text-wrap: balance; }
.insp-body { white-space: pre-wrap; color: var(--fg); background: var(--bg); border-radius: 10px; padding: 12px; margin: 12px 0; font-size: 13px; overflow-wrap: anywhere; }
.insp-body.md { font-family: var(--font-mono); font-size: 12px; }
.insp-section { margin-top: 18px; }
.insp-section h2 { margin-bottom: 6px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.iconbtn { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--hover); color: var(--fg); }

/* Palette */
.scrim { position: fixed; inset: 0; background: rgba(12, 20, 16, .32); z-index: 50; display: flex; justify-content: center; align-items: flex-start; padding-top: max(10vh, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.palette { width: 100%; max-width: 680px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 76vh; overflow: hidden; animation: pop .14s ease-out; }
@keyframes pop { from { transform: translateY(-6px) scale(.985); opacity: .4; } }
.pal-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.pal-input input { flex: 1; border: 0; outline: none; background: transparent; font-size: 16px; min-width: 0; }
.pal-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px 0; }
.pal-chips:empty { display: none; }
.pal-results { overflow-y: auto; padding: 6px 8px 8px; }
.pal-item { display: flex; gap: 11px; align-items: center; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.pal-item.active { background: var(--hover); }
.pal-item .row-main { min-width: 0; }
.pal-item .enter { margin-left: auto; opacity: 0; }
.pal-item.active .enter { opacity: 1; }

/* ---------- Query engine: zoekbalk + views ---------- */
const TYPE_ALIAS = { mail: 'mail', email: 'mail', inbox: 'mail', slack: 'slack', chat: 'slack', meeting: 'meeting', meetings: 'meeting', afspraak: 'meeting', agenda: 'meeting',
  context: 'context', ctx: 'context', github: 'context', taak: 'task', taken: 'task', task: 'task', tasks: 'task', drive: 'file', file: 'file', doc: 'file', bestand: 'file' };

function parseQuery(q) {
  const out = { types: [], entities: [], from: [], in: [], when: null, is: [], text: [] };
  for (const raw of q.trim().split(/\s+/).filter(Boolean)) {
    const tok = raw.toLowerCase();
    let m;
    if (tok.startsWith('@') && tok.length > 1) out.entities.push(tok.slice(1));
    else if ((m = tok.match(/^(type|bron|from|van|in|when|wanneer|is|partner):(.+)$/))) {
      const [, k, v] = m;
      if (k === 'type' || k === 'bron') { const t = TYPE_ALIAS[v]; if (t) out.types.push(t); }
      else if (k === 'from' || k === 'van') out.from.push(v);
      else if (k === 'in') out.in.push(v);
      else if (k === 'when' || k === 'wanneer') out.when = v;
      else if (k === 'is') out.is.push(v);
      else if (k === 'partner') out.entities.push(v);
    } else out.text.push(tok);
  }
  return out;
}
function matchEntityToken(tok) {
  return Object.keys(ENTITIES).filter(id => id.startsWith(tok) || ENTITIES[id].aliases.some(a => a.startsWith(tok)) || ENTITIES[id].name.toLowerCase().includes(tok));
}

  return [it.title, it.body, it.channel, it.from && PEOPLE[it.from]?.name, ...(it.entities || []).map(e => ENTITIES[e].name + ' ' + ENTITIES[e].aliases.join(' ')),
    ...(it.people || []).map(p => PEOPLE[p].name)].join(' ').toLowerCase();
}
function runQuery(q) {
  const p = parseQuery(q);
  const entIds = p.entities.flatMap(matchEntityToken);
  const res = ITEMS.filter(it => {
    if (p.types.length && !p.types.includes(it.type)) return false;
    if (p.entities.length && !(it.entities || []).some(e => entIds.includes(e))) return false;
    if (p.from.length && !p.from.some(f => it.from && PEOPLE[it.from].name.toLowerCase().includes(f) || (it.people || []).some(pp => PEOPLE[pp].name.toLowerCase().includes(f)))) return false;
    if (p.in.length && !(it.channel && p.in.some(c => it.channel.toLowerCase().includes(c.replace(/^#/, ''))))) return false;
    if (p.when) {
      const t = when(it), today = d(TODAY);

      if ((p.when === 'vandaag' || p.when === 'today') && diff !== 0) return false;
      if ((p.when === 'week' || p.when === 'deze-week') && (diff < -4 || diff > 2)) return false;
      if ((p.when === 'maand' || p.when === 'month') && t.getMonth() !== today.getMonth()) return false;
      if (p.when === 'gisteren' && diff !== -1) return false;
      if (p.when === 'komend' && t < S.clock) return false;
    }
    for (const flag of p.is) {
      if (flag === 'open' && !(it.type === 'task' ? !it.done : it.type === 'meeting' ? it.writeback === 'pending' : true)) return false;
      if (flag === 'unread' && !it.unread) return false;
      if (flag === 'pending' && it.writeback !== 'pending') return false;
      if ((flag === 'done' || flag === 'klaar') && !(it.done || it.writeback === 'done')) return false;
    }
    if (p.text.length) { const h = haystack(it); if (!p.text.every(w => h.includes(w))) return false; }
    return true;
  });
  res.sort((a, b) => when(b) - when(a));

  return { items: res, entityHits, parsed: p };
}

function routeFromHash() {

  if (h.startsWith('e-') && ENTITIES[h.slice(2)]) return { view: 'entity', id: h.slice(2) };
  if (h.startsWith('m-') && byId(h.slice(2))) return { view: 'meeting', id: h.slice(2) };
  const b = BUILTIN_VIEWS.find(v => v.id === h);
  if (b) return { view: 'list', q: b.q, title: b.name, key: b.id };
  const s = S.saved.find(v => v.id === h);
  if (s) return { view: 'list', q: s.q, title: s.name, key: s.id, saved: true };
  return { view: 'vandaag' };
}
function hashFor(r) {
  if (r.view === 'entity') return 'e-' + r.id;
  if (r.view === 'meeting') return 'm-' + r.id;
  if (r.view === 'list') return r.key || '';
  return r.view;
}

  const todays = ITEMS.filter(i => i.type === 'meeting' && i.start.startsWith(TODAY)).sort((a, b) => when(a) - when(b));
  const pending = ITEMS.filter(i => i.type === 'meeting' && i.writeback === 'pending').sort((a, b) => when(b) - when(a));
  const next = ITEMS.filter(i => i.type === 'meeting' && d(i.start) > S.clock).sort((a, b) => when(a) - when(b))[0];
  const tasks = ITEMS.filter(i => i.type === 'task' && (i.due <= ymd(new Date(+d(TODAY) + 3 * 864e5)))).sort((a, b) => (a.done - b.done) || a.due.localeCompare(b.due));
  const recent = ITEMS.filter(i => ['mail', 'slack', 'context'].includes(i.type) && when(i) <= S.clock).sort((a, b) => when(b) - when(a)).slice(0, 6);
  const H0 = 8, H1 = 18, PX = 46;
  const nowTop = ((S.clock.getHours() + S.clock.getMinutes() / 60) - H0) * PX + 6;
  return `<div class="page">
    <div class="page-head"><div><div class="eyebrow">Goedemiddag Robert</div><h1>${longDay(d(TODAY)).replace(/^./, c => c.toUpperCase())}</h1></div>
      <button class="btn" data-action="palette">${ic('search')}Zoek in alles<span class="kbd">⌘K</span></button></div>
    ${pending.length ? `<div class="banner"><span class="ic">${ic('context')}</span>
      <div class="row-main"><b>${pending.length} ${pending.length === 1 ? 'meeting wacht' : 'meetings wachten'} op wegschrijven naar de contextlaag</b>
      <div class="sub" style="font-size:13px">${pending.map(m => esc(m.title)).join(' · ')}. Transcript, besluiten en afspraken staan klaar om te controleren.</div></div>
      <button class="btn primary" data-go="m-${pending[0].id}">Controleren en wegschrijven ${ic('arrow')}</button></div>` : ''}
    <div class="grid2">
      <div class="card">
        <div class="card-head"><h2>Agenda vandaag</h2><span class="legend"><span><span class="dot" style="background:var(--accent)"></span>weggeschreven</span><span><span class="dot" style="background:var(--warn)"></span>wacht</span></span></div>
        <div class="timeline" style="height:${(H1 - H0) * PX + 18}px">
          ${Array.from({ length: H1 - H0 }, (_, i) => `<div class="tl-hour"><span>${String(H0 + i).padStart(2, '0')}:00</span></div>`).join('')}
          ${todays.map(m => {
            const s = d(m.start), e = d(m.end);
            const top = ((s.getHours() + s.getMinutes() / 60) - H0) * PX + 6;
            const h = Math.max(((e - s) / 36e5) * PX - 3, 28);
            const col = m.writeback === 'done' ? 'var(--accent)' : m.writeback === 'pending' ? 'var(--warn)' : 'var(--c-meeting)';
            return `<div class="tl-event${isPast(m) ? ' past' : ''}${h < 44 ? ' short' : ''}" data-go="m-${m.id}" style="top:${top}px;height:${h}px;border-left-color:${col};background:color-mix(in srgb, ${col} 11%, var(--panel))">
              <b>${esc(m.title)}</b><span class="t">${hm(s)}–${hm(e)} ${m.entities.map(entityChip).join('')} ${h > 40 ? wbChip(m) : ''}</span></div>`;
          }).join('')}
          <div class="now-line" style="top:${nowTop}px" title="Nu ${hm(S.clock)}"></div>
        </div>
      </div>
      <div class="stack">
        ${next ? briefCard(next) : ''}
        <div class="card"><div class="card-head"><h2>Taken</h2><button class="btn sm" data-go="taken">Alle taken</button></div>
          <div class="card-body" style="padding:6px"><div class="list">${tasks.map(t => rowHTML(t)).join('')}</div></div></div>
        <div class="card"><div class="card-head"><h2>Net binnen</h2><button class="btn sm" data-go="activiteit">Activiteit</button></div>
          <div class="card-body" style="padding:6px"><div class="list">${recent.map(t => rowHTML(t)).join('')}</div></div></div>
      </div>
    </div></div>`;
}

function related(entityIds, excludeId, limit = 8) {
  return ITEMS.filter(i => i.id !== excludeId && (i.entities || []).some(e => entityIds.includes(e))).sort((a, b) => when(b) - when(a)).slice(0, limit);
}

function briefCard(m) {
  const e = ENTITIES[m.entities[0]];
  const mins = Math.round((d(m.start) - S.clock) / 6e4);
  return `<div class="card">
    <div class="card-head"><div><div class="eyebrow">Volgende · ${mins < 120 && mins > 0 ? 'over ' + mins + ' min' : dayLabel(d(m.start)) + ' ' + hm(d(m.start))}</div><h3 style="margin-top:2px">${esc(m.title)}</h3></div>
      <button class="btn sm" data-go="m-${m.id}">Open</button></div>
    <div class="card-body">
      ${e ? `<div class="eyebrow" style="margin-bottom:6px;display:flex;gap:6px;align-items:center">${ic('context')} Uit de contextlaag</div>
      <ul class="brief">${e.afspraken.slice(0, 2).map(a => `<li>${esc(a)}</li>`).join('')}${e.open.slice(0, 2).map(a => `<li><span class="sub">Open vraag:</span> ${esc(a)}</li>`).join('')}</ul>` : ''}
      <div class="sub" style="font-size:12.5px;margin-top:8px">${related(m.entities, m.id, 40).filter(i => i.type !== 'meeting' && when(i) > new Date(+S.clock - 3 * 864e5)).length} nieuwe items sinds de vorige afspraak</div>
    </div></div>`;
}

function viewAgenda() {
  const base = new Date(d('2026-10-26').getTime() + S.weekOffset * 7 * 864e5);
  const days = Array.from({ length: 5 }, (_, i) => new Date(+base + i * 864e5));
  const H0 = 8, H1 = 18, PX = 44;
  const wk = Math.ceil(((base - new Date(base.getFullYear(), 0, 1)) / 864e5 + new Date(base.getFullYear(), 0, 1).getDay() + 1) / 7);
  return `<div class="page">
    <div class="page-head"><div><div class="eyebrow">Google Agenda · week ${wk}</div><h1>${days[0].getDate()} – ${days[4].getDate()} ${MONTHS[days[4].getMonth()]}</h1></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="legend"><span><span class="dot" style="background:var(--accent)"></span>Weggeschreven</span><span><span class="dot" style="background:var(--warn)"></span>Wacht op wegschrijven</span><span><span class="dot" style="background:var(--c-meeting)"></span>Briefing klaar</span></div>
        <button class="iconbtn" data-action="week" data-dir="-1" aria-label="Vorige week">${ic('chevL')}</button>
        <button class="btn sm" data-action="week" data-dir="0">Deze week</button>
        <button class="iconbtn" data-action="week" data-dir="1" aria-label="Volgende week">${ic('chevR')}</button>
      </div></div>
    <div class="card week-wrap"><div class="week">
      <div class="wk-head"></div>
      ${days.map(dt => `<div class="wk-head${ymd(dt) === TODAY ? ' today' : ''}">${DAYS[dt.getDay()].slice(0, 2)}<b>${dt.getDate()}</b></div>`).join('')}
      <div class="wk-hours">${Array.from({ length: H1 - H0 }, (_, i) => `<div class="wk-hl">${H0 + i}:00</div>`).join('')}</div>
      ${days.map(dt => {
        const evs = ITEMS.filter(i => i.type === 'meeting' && i.start.startsWith(ymd(dt)));
        return `<div class="wk-col">${Array.from({ length: H1 - H0 }, () => `<div class="wk-hl"></div>`).join('')}
          ${evs.map(m => {
            const s = d(m.start), e = d(m.end);
            const top = ((s.getHours() + s.getMinutes() / 60) - H0) * PX;
            const h = Math.max(((e - s) / 36e5) * PX - 3, 24);
            const label = m.writeback === 'done' ? 'Weggeschreven' : m.writeback === 'pending' ? 'Wacht op wegschrijven' : 'Briefing klaar';
            return `<div class="wk-ev ${m.writeback}" data-go="m-${m.id}" style="top:${top}px;height:${h}px" title="${esc(m.title)}"><b>${esc(m.title)}</b>${h > 34 ? `<span class="state">${hm(s)} · ${label}</span>` : ''}</div>`;
          }).join('')}
          ${ymd(dt) === TODAY ? `<div class="now-line" style="left:0;right:0;top:${((S.clock.getHours() + S.clock.getMinutes() / 60) - H0) * PX}px"></div>` : ''}
        </div>`;
      }).join('')}
    </div></div>
    <p class="hint" style="margin-top:12px">Klik op een afspraak om de context te zien: vooraf de briefing uit de contextlaag, achteraf wat er is weggeschreven.</p>
  </div>`;
}

function viewMeeting(id) {
  const m = byId(id);
  const e = ENTITIES[m.entities[0]];
  const past = isPast(m);
  const wb = WRITEBACK[id];
  const rel = related(m.entities, m.id, 12).filter(i => i.type !== 'meeting');
  const lastMeeting = ITEMS.filter(i => i.type === 'meeting' && i.id !== m.id && i.entities.some(x => m.entities.includes(x)) && d(i.start) < d(m.start) && i.writeback === 'done').sort((a, b) => when(b) - when(a))[0];
  let body = '';
  if (m.writeback === 'pending' && wb) body = writebackPanel(m, wb);
  else if (m.writeback === 'pending') body = `<div class="card"><div class="card-body">Transcript wordt verwerkt…</div></div>`;
  else if (m.writeback === 'done') body = `<div class="committed"><span class="ic">${ic('commit')}</span><div class="row-main"><b>Weggeschreven naar de contextlaag</b>
      <div class="mono sub">${esc(m.file || '')} · commit ${esc(m.commit)}</div></div>
      ${m.file ? `<button class="btn sm" data-open="${(ITEMS.find(i => i.type === 'context' && i.title === m.file) || {}).id || ''}">Bekijk</button>` : ''}</div>
      ${m.justCommitted ? `<div class="card" style="margin-top:14px"><div class="card-head"><h2>Wat er nu is gebeurd</h2></div><div class="card-body"><ul class="brief">${m.justCommitted.map(x => `<li>${x}</li>`).join('')}</ul></div></div>` : ''}`;
  else body = '';

  const briefing = e ? `<div class="card"><div class="card-head"><h2 style="display:flex;gap:7px;align-items:center">${ic('context')}Briefing uit de contextlaag</h2><span class="mono sub">${esc(e.repo)}/</span></div>
    <div class="card-body" style="display:flex;flex-direction:column;gap:12px">
      <div>${esc(e.summary)}</div>
      ${e.afspraken.length ? `<div><div class="eyebrow" style="margin-bottom:4px">Lopende afspraken</div><ul class="brief">${e.afspraken.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}
      ${e.open.length ? `<div><div class="eyebrow" style="margin-bottom:4px">Open vragen om te stellen</div><ul class="brief">${e.open.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}
      ${lastMeeting ? `<div><div class="eyebrow" style="margin-bottom:4px">Vorige afspraak</div>${rowHTML(lastMeeting)}</div>` : ''}
    </div></div>` : `<div class="card"><div class="card-body sub">Geen partner of product gekoppeld. Koppel er een via ⌘K om context te laden.</div></div>`;

  return `<div class="page">
    <div class="page-head" style="align-items:flex-start"><div style="min-width:0">
      <div class="eyebrow" style="display:flex;gap:8px;align-items:center">${srcLabel('meeting')} · ${longDay(d(m.start))}</div>
      <h1>${esc(m.title)}</h1>
      <div class="meta-line"><span>${hm(d(m.start))}–${hm(d(m.end))} · ${esc(m.where)}</span>${m.entities.map(entityChip).join('')}${wbChip(m)}${m.transcript ? `<span class="chip">${ic('mic')}${esc(m.transcript)}</span>` : ''}</div>
      <div class="people" style="margin-top:10px">${m.people.map(p => `<span class="person">${avatar(p)}${esc(PEOPLE[p].name)}</span>`).join('')}</div>
    </div>
    <button class="btn" data-action="palette-q" data-q="@${m.entities[0] || ''} ">${ic('search')}Zoek in deze context</button></div>
    <div class="grid2">
      <div class="stack">${past ? body : ''}${past && m.writeback !== 'planned' ? '' : ''}${!past ? briefing : ''}${past && m.writeback === 'done' && !m.justCommitted ? briefing : ''}${!past ? `<div class="card"><div class="card-body sub" style="display:flex;gap:10px;align-items:center">${ic('mic')}Na afloop haalt de workspace het transcript op (Wispr Flow / tl;dv) en stelt voor wat er naar de contextlaag moet.</div></div>` : ''}</div>
      <div class="stack">
        ${past && m.writeback === 'pending' ? briefing.replace('Briefing uit de contextlaag', 'Briefing (vooraf)') : ''}
        <div class="card"><div class="card-head"><h2>Gekoppeld aan ${e ? esc(e.short) : 'deze meeting'}</h2><span class="sub" style="font-size:12px">${rel.length} items</span></div>
          <div class="card-body" style="padding:6px"><div class="list">${rel.map(i => rowHTML(i)).join('') || '<div class="empty">Nog niets gekoppeld</div>'}</div></div></div>
      </div>
    </div></div>`;
}

function writebackPanel(m, wb) {
  const ck = S.wbChecks[m.id] ||= Object.fromEntries(wb.actions.map((_, i) => [i, true]));
  return `<div class="card">
    <div class="card-head"><div><div class="eyebrow" style="display:flex;gap:6px;align-items:center">${ic('spark')}Voorstel uit transcript · ${esc(m.transcript)}</div><h3 style="margin-top:2px">Wegschrijven naar de contextlaag</h3></div><span class="chip warn">Concept</span></div>
    <div class="wb-section"><h2>Samenvatting</h2><div>${esc(wb.summary)}</div></div>
    <div class="wb-section"><h2>Besluiten</h2><ul class="brief">${wb.decisions.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="wb-section"><h2>Afspraken → Google Tasks</h2>
      ${wb.actions.map((a, i) => `<label class="check"><input type="checkbox" id="wb-${m.id}-${i}" data-wb="${m.id}" data-i="${i}" ${ck[i] ? 'checked' : ''}><span class="row-main">${esc(a.text)}</span><span class="who">${esc(a.who)} · ${fmtDue(a.due)}</span></label>`).join('')}
    </div>
    ${wb.answered.length ? `<div class="wb-section"><h2>Beantwoorde vragen uit Slack</h2>${wb.answered.map(x => `<div class="answer-q"><div class="sub" style="font-size:12px">${esc(x.q)}</div><div>${esc(x.a)}</div><div class="actions"><button class="btn sm" data-open="${x.ref}">${ic('slack')}Bekijk vraag</button><span class="sub" style="font-size:12px;align-self:center">Antwoord wordt in de thread gezet bij wegschrijven</span></div></div>`).join('')}</div>` : ''}
    <div class="wb-section"><h2>Wijzigingen in de contextlaag <span class="sub" style="font-weight:400">· ${wb.files.length} bestanden</span></h2>
      ${wb.files.map(f => `<div class="diff"><div class="diff-head"><span class="mono">${esc(f.path)}</span><span class="chip ${f.state === 'nieuw' ? 'ok' : ''}">${f.state}</span></div>
        <pre>${f.lines.map(([t, s]) => `<span class="ln ${t === '+' ? 'add' : t === '-' ? 'del' : 'ctx'}">${t === ' ' ? '  ' : t + ' '}${esc(s)}</span>`).join('')}</pre></div>`).join('')}
    </div>
    <div class="wb-section" style="flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center">
      <button class="btn primary" data-action="commit" data-id="${m.id}">${ic('commit')}Wegschrijven naar contextlaag</button>
      <button class="btn" data-action="toast" data-msg="In de echte app open je hier de editor om het voorstel aan te passen">Aanpassen</button>
      <span class="sub" style="font-size:12px">Commit naar <span class="mono">homezero/context</span> · taken naar Google Tasks</span>
    </div></div>`;
}

function commitWriteback(id) {
  const m = byId(id), wb = WRITEBACK[id];
  const hash = Math.random().toString(16).slice(2, 9);
  S.clock = new Date(+S.clock + 60e3);
  const t = ymd(S.clock) + 'T' + hm(S.clock);
  m.writeback = 'done'; m.commit = hash; m.file = wb.files[0].path;
  const ck = S.wbChecks[id] || {};
  const newTasks = wb.actions.filter((_, i) => ck[i] !== false);
  wb.files.forEach((f, i) => {
    const existing = ITEMS.find(x => x.type === 'context' && x.title === f.path);
    const body = f.lines.filter(([k]) => k !== '-').map(([, s]) => s).join('\n');
    if (existing) { existing.time = t; existing.commit = hash; existing.from = 'robert'; existing.body = body; }
    else ITEMS.push({ id: 'c-' + hash + i, type: 'context', title: f.path, time: t, commit: hash, from: 'robert', entities: m.entities, body, meeting: id });
  });
  newTasks.forEach((a, i) => ITEMS.push({ id: 't-' + hash + i, type: 'task', title: `${a.text} (${a.who})`, due: a.due, done: false, entities: m.entities, time: t }));
  wb.answered.forEach((x, i) => { const q = byId(x.ref); ITEMS.push({ id: 's-' + hash + i, type: 'slack', channel: q.channel, dm: q.dm, from: 'robert', time: t, entities: m.entities, title: x.a }); });
  if (id === 'm1') {
    const e = ENTITIES.veenstra;
    e.afspraken = ['Agenda-sync naar productie (Mark, 6 nov)', 'Home Zero vernieuwt het offerte-sjabloon hybride warmtepomp', 'Lead agent zonnepanelen: voorstel in Q4 planning (10 nov)', 'Maandelijkse check-in, laatste vrijdag van de maand'];
    e.open = ['Prijzen per merk voor sjabloon hybride nog aanleveren'];
    e.facts[0] = ['Fase', 'Live · uitbreiding zonnepanelen jan 2027'];
    e.facts[3] = ['Agenda', 'Alleen Outlook (bevestigd 30 okt)'];
  }
  m.justCommitted = [
    `${wb.files.length} bestanden gecommit naar <span class="mono">homezero/context</span> (commit <span class="mono">${hash}</span>)`,
    `${newTasks.length} taken aangemaakt in Google Tasks`,
    ...(wb.answered.length ? [`Antwoord geplaatst in Slack (${esc(byId(wb.answered[0].ref).channel)})`] : []),
    `Briefing voor de volgende afspraak is bijgewerkt`,
  ];
  toast(`${ic('commit')}Weggeschreven · commit ${hash}`);
  render();
}

function viewEntity(id) {
  const e = ENTITIES[id];
  const all = ITEMS.filter(i => (i.entities || []).includes(id)).sort((a, b) => when(b) - when(a));
  const cnt = t => all.filter(i => i.type === t).length;
  const upcoming = all.filter(i => i.type === 'meeting' && d(i.start) > S.clock).sort((a, b) => when(a) - when(b));
  const openTasks = all.filter(i => i.type === 'task' && !i.done);
  const ctxFiles = all.filter(i => i.type === 'context');
  const timeline = all.filter(i => i.type !== 'task' && when(i) <= S.clock);
  const byDay = {};
  timeline.forEach(i => (byDay[ymd(when(i))] ||= []).push(i));
  return `<div class="page">
    <div class="page-head" style="align-items:flex-start">
      <div class="entity-hero"><div class="entity-logo">${esc(e.short.slice(0, 2).toUpperCase())}</div>
        <div><div class="eyebrow">${esc(e.kind)} · ${esc(e.status)}</div><h1>${esc(e.name)}</h1>
        <div class="repo-path mono" style="margin-top:4px">${ic('context')}homezero/context/${esc(e.repo)}/</div></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-action="palette-q" data-q="@${id} ">${ic('search')}Zoek binnen ${esc(e.short)}</button>
        <button class="btn" data-action="ask" data-q="Wat is de stand van zaken bij ${esc(e.short)}?">${ic('spark')}Vraag de contextlaag</button>
      </div>
    </div>
    <div class="counts" style="margin-bottom:18px">${TYPE_ORDER.filter(cnt).map(t => `<button class="count-pill" data-action="palette-q" data-q="@${id} type:${t === 'file' ? 'drive' : t} "><span class="src src-${t}">${ic(SRC[t].icon)}</span><b>${cnt(t)}</b>${SRC[t].plural}</button>`).join('')}</div>
    <div class="grid2">
      <div class="stack">
        <div class="card"><div class="card-head"><h2>Tijdlijn</h2><span class="sub" style="font-size:12px">alle bronnen</span></div>
          <div class="card-body" style="padding:6px">${Object.entries(byDay).map(([day, its]) => `<div class="group-label">${dayLabel(d(day))}</div><div class="list">${its.map(i => rowHTML(i)).join('')}</div>`).join('')}</div></div>
      </div>
      <div class="stack">
        <div class="card"><div class="card-head"><h2 style="display:flex;gap:7px;align-items:center">${ic('context')}Contextlaag</h2><span class="sub" style="font-size:12px">bijgewerkt ${ctxFiles[0] ? dayLabel(when(ctxFiles[0])).toLowerCase() : '–'}</span></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:12px">
            <div>${esc(e.summary)}</div>
            <dl class="facts">${e.facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
            ${e.people.length ? `<div class="people">${e.people.map(p => `<span class="person">${avatar(p)}${esc(PEOPLE[p].name)}</span>`).join('')}</div>` : ''}
            <div><div class="eyebrow" style="margin-bottom:4px">Lopende afspraken</div><ul class="brief">${e.afspraken.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>
            ${e.open.length ? `<div><div class="eyebrow" style="margin-bottom:4px">Open vragen</div><ul class="brief">${e.open.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}
            <div class="list">${ctxFiles.slice(0, 4).map(i => rowHTML(i)).join('')}</div>
          </div></div>
        ${upcoming.length ? `<div class="card"><div class="card-head"><h2>Komende afspraken</h2></div><div class="card-body" style="padding:6px"><div class="list">${upcoming.map(i => rowHTML(i)).join('')}</div></div></div>` : ''}
        ${openTasks.length ? `<div class="card"><div class="card-head"><h2>Open taken</h2></div><div class="card-body" style="padding:6px"><div class="list">${openTasks.map(i => rowHTML(i)).join('')}</div></div></div>` : ''}
      </div>
    </div></div>`;
}

function viewList(r) {
  return `<div class="page">
    <div class="page-head"><div><div class="eyebrow">${r.saved ? 'Opgeslagen view' : r.key ? 'Bron' : 'Zoekresultaten'}</div><h1>${esc(r.title || 'Zoeken')}</h1></div>

function answer(q) {
  const ql = q.toLowerCase();
  const ents = Object.keys(ENTITIES).filter(id => ENTITIES[id].aliases.some(a => ql.includes(a)) || ql.includes(ENTITIES[id].name.toLowerCase()));

  const rel = related([id], null, 30);
  const next = rel.filter(i => i.type === 'meeting' && d(i.start) > S.clock).sort((a, b) => when(a) - when(b))[0];

    ${tasks.length ? `<br>${tasks.length} open ${tasks.length === 1 ? 'taak' : 'taken'}.` : ''}`;
  const sources = [rel.find(i => i.type === 'context'), last, rel.find(i => i.type === 'mail'), rel.find(i => i.type === 'slack'), tasks[0]].filter(Boolean).map(i => i.id);
  return { html, sources };
}

function palEntries() {

    const rest = q.slice(1).trim().toLowerCase();
    const arg = q.slice(1).trim();
    COMMANDS.forEach(c => {
      const base = c.label.replace('…', '').toLowerCase();
      if (!rest || base.includes(rest) || c.label.endsWith('…')) out.push({ kind: 'cmd', c, arg: c.label.endsWith('…') && rest && !base.includes(rest) ? arg : '' });
    });
    return out;
  }
  if (!q) {
    SUGGESTED.forEach(s => out.push({ kind: 'query', q: s.q, label: s.label }));
    S.recent.slice(0, 4).forEach(r => out.push({ kind: 'recent', q: r }));
    COMMANDS.slice(0, 3).forEach(c => out.push({ kind: 'cmd', c, arg: '' }));
    return out;
  }
  const { items, entityHits } = runQuery(q);
  entityHits.slice(0, 2).forEach(id => out.push({ kind: 'entity', id }));
  grouped(items).forEach(([t, its]) => its.slice(0, t === 'context' ? 4 : 5).forEach(it => out.push({ kind: 'item', it })));
  out.push({ kind: 'all', count: items.length });
  if (/\?$/.test(q) || q.split(' ').length > 3) out.splice(entityHits.length ? 1 : 0, 0, { kind: 'ask', q });
  return out;
}

      html += `<div class="pal-item${a}" data-pi="${i}"><span class="ic">${ic(en.c.icon)}</span><div class="row-main"><div class="row-title">${esc(en.c.label.replace('…', ''))}${en.arg ? `: <span class="sub">${esc(en.arg)}</span>` : en.c.label.endsWith('…') ? '…' : ''}</div></div><span class="row-meta">${esc(en.c.hint)}</span></div>`;
    } else if (en.kind === 'ask') {
      html += `<div class="pal-item${a}" data-pi="${i}"><span class="ic context">${ic('spark')}</span><div class="row-main"><div class="row-title">Vraag de contextlaag: “${esc(en.q)}”</div><div class="row-sub">Antwoord met bronnen uit alle gekoppelde apps</div></div><span class="enter kbd">↵</span></div>`;
    } else if (en.kind === 'all') {
      html += `<div class="pal-item${a}" data-pi="${i}" style="margin-top:4px"><span class="ic">${ic('arrow')}</span><div class="row-main"><div class="row-title">Toon alle ${en.count} resultaten als view</div></div><span class="enter kbd">↵</span></div>`;
    }
  });
  if (q && !q.startsWith('>') && entries.length === 1) html = `<div class="empty">Niets gevonden voor “${esc(q)}”.</div>` + html;
  const res = document.getElementById('pal-res');
  res.innerHTML = html;
  res.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
  document.getElementById('pal-foot').innerHTML = `<span><span class="kbd">↑↓</span>navigeer</span><span><span class="kbd">↵</span>open</span><span><span class="kbd">&gt;</span>commando’s</span>${q && !q.startsWith('>') ? `<button class="save" data-action="pal-save">${ic('bookmark')} Bewaar als view <span class="kbd">⌘↵</span></button>` : ''}`;
}
function palKeys(ev) {
  const P_ = S.palette;
  if (ev.key === 'ArrowDown') { ev.preventDefault(); P_.active = Math.min(P_.active + 1, P_.entries.length - 1); renderPalette(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); P_.active = Math.max(P_.active - 1, 0); renderPalette(); }
  else if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); if (P_.q.trim()) saveView(P_.q.trim()); }
  else if (ev.key === 'Enter') { ev.preventDefault(); palPick(P_.active); }
  else if (ev.key === 'Escape') { ev.preventDefault(); closePalette(); }
  else if (ev.key === 'Tab' && P_.entries[P_.active]?.kind === 'entity') { ev.preventDefault(); const inp = document.getElementById('pal-q'); inp.value = '@' + P_.entries[P_.active].id + ' '; P_.q = inp.value; renderPalette(); }
}
function remember(q) { if (!q) return; S.recent = [q, ...S.recent.filter(x => x !== q)].slice(0, 6); store.set('recent', S.recent); }
function palPick(i) {
  const en = S.palette.entries[i]; if (!en) return;
  const q = S.palette.q.trim();
  if (en.kind === 'query' || en.kind === 'recent') { const inp = document.getElementById('pal-q'); inp.value = en.q + ' '; S.palette.q = inp.value; S.palette.active = 0; renderPalette(); inp.focus(); return; }
  closePalette();
  if (en.kind === 'cmd') return en.c.run(en.arg);
  remember(q);
  if (en.kind === 'entity') return go({ view: 'entity', id: en.id });
  if (en.kind === 'ask') return ask(q);
  if (en.kind === 'all') return go({ view: 'list', q, title: 'Zoeken', adhoc: true });
  if (en.kind === 'item') return openItem(en.it.id, q);
}
function openItem(id, q) {
  const it = byId(id);
  if (it.type === 'meeting') return go({ view: 'meeting', id });
  if (q && S.route.view !== 'list') go({ view: 'list', q, title: 'Zoeken', adhoc: true });
  S.selected = id; renderInspector(); renderMainHighlights();
}
function saveView(q) {
  const p = parseQuery(q);
  const ent = p.entities.flatMap(matchEntityToken)[0] || p.text.flatMap(t => matchEntityToken(t))[0];
  const typeName = p.types.map(t => SRC[t].plural).join(' + ');
  const name = [typeName, ent && ENTITIES[ent].short, p.is.includes('unread') && 'ongelezen', p.is.includes('open') && 'open', p.when && p.when].filter(Boolean).join(' · ') || q;
  const v = { id: 'v-' + Date.now().toString(36), name: name.replace(/^./, c => c.toUpperCase()), q };
  S.saved.push(v); store.set('saved', S.saved);
  closePalette();
  toast(`${ic('bookmark')}View “${esc(v.name)}” bewaard in de zijbalk`);
  go({ view: 'list', q, title: v.name, key: v.id, saved: true });
}

/* ---------- Render ---------- */
function renderMainHighlights() {
  document.querySelectorAll('#main [data-open]').forEach(el => el.classList.toggle('sel', el.dataset.open === S.selected));
}
function render() {
  renderSidebar();
  const r = S.route, main = document.getElementById('main');
  let html = '';
  if (r.view === 'vandaag') html = viewVandaag();
  else if (r.view === 'agenda') html = viewAgenda();
  else if (r.view === 'meeting') html = viewMeeting(r.id);
  else if (r.view === 'entity') html = viewEntity(r.id);
  else if (r.view === 'list') html = viewList(r);
  else if (r.view === 'activiteit') html = viewActiviteit();
  else if (r.view === 'chat') html = viewChat();
  main.classList.toggle('is-chat', r.view === 'chat');
  main.style.overflowY = r.view === 'chat' ? 'hidden' : '';
  main.innerHTML = topbar() + html;
  if (r.view === 'list') {
    renderListResults();
    const qb = document.getElementById('qbar');
    qb.addEventListener('input', () => { S.route.q = qb.value; renderListResults(); renderMainHighlights(); });
  }
  if (r.view === 'chat') { const m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight; }
  renderInspector();
  renderMainHighlights();
}

let toastTimer;
function toast(html) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2800);
}

/* ---------- Events ---------- */
document.addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); S.palette ? closePalette() : openPalette(); }
  else if (ev.key === 'Escape' && !S.palette && S.selected) { S.selected = null; renderInspector(); renderMainHighlights(); }
  else if (ev.key === '/' && !S.palette && !/input|textarea/i.test(document.activeElement.tagName)) { ev.preventDefault(); openPalette(); }
});
document.addEventListener('click', ev => {
  const t = ev.target;
  const pi = t.closest('[data-pi]'); if (pi) { palPick(+pi.dataset.pi); return; }
  const a = t.closest('[data-action]');
  if (a) {
    const act = a.dataset.action;
    if (act === 'close-pal') { if (t === a) closePalette(); return; }
    if (act === 'palette') { openPalette(); return; }
    if (act === 'palette-q') { openPalette(a.dataset.q); return; }
    if (act === 'pal-save') { saveView(S.palette.q.trim()); return; }
    if (act === 'nav') { document.getElementById('app').classList.toggle('nav-open'); return; }
    if (act === 'close-insp') { S.selected = null; renderInspector(); renderMainHighlights(); return; }
    if (act === 'commit') { commitWriteback(a.dataset.id); return; }
    if (act === 'toast') { toast(esc(a.dataset.msg)); return; }
    if (act === 'ask') { ask(a.dataset.q); return; }
    if (act === 'week') { const dir = +a.dataset.dir; S.weekOffset = dir === 0 ? 0 : S.weekOffset + dir; render(); return; }
    if (act === 'save-view') { saveView(S.route.q.trim()); return; }
    if (act === 'delete-view') { S.saved = S.saved.filter(v => v.id !== a.dataset.id); store.set('saved', S.saved); go({ view: 'vandaag' }); toast('View verwijderd'); return; }
    if (act === 'toggle-task') { const it = byId(a.dataset.id); it.done = !it.done; render(); toast(it.done ? `${ic('task')}Afgevinkt in Google Tasks` : 'Taak heropend'); return; }
    if (act === 'mk-task') { const it = byId(a.dataset.id); ITEMS.push({ id: 't-' + Date.now(), type: 'task', title: 'Opvolgen: ' + short(it.title, 60), due: ymd(new Date(+d(TODAY) + 864e5)), done: false, entities: it.entities, time: ymd(S.clock) + 'T' + hm(S.clock) }); render(); toast(`${ic('task')}Taak aangemaakt voor morgen`); return; }
  }
  const ent = t.closest('[data-entity]'); if (ent) { ev.stopPropagation(); go({ view: 'entity', id: ent.dataset.entity }); return; }
  const g = t.closest('[data-go]');
  if (g) {
    const k = g.dataset.go;
    if (k.startsWith('e-')) return go({ view: 'entity', id: k.slice(2) });
    if (k.startsWith('m-')) return go({ view: 'meeting', id: k.slice(2) });
    location.hash === '#' + k ? (S.route = routeFromHash(), render()) : (location.hash = k);
    document.getElementById('app').classList.remove('nav-open');
    return;
  }
  const o = t.closest('[data-open]'); if (o && o.dataset.open) { openItem(o.dataset.open); return; }
  const ch = t.closest('[data-chat]'); if (ch) { S.chatChannel = ch.dataset.chat; render(); return; }
  const co = t.closest('[data-chat-open]'); if (co) { S.chatChannel = co.dataset.chatOpen; S.selected = null; go({ view: 'chat' }); return; }
  const md = t.closest('[data-mode]'); if (md) { if (md.dataset.mode === 'ai') S.chatChannel = 'ai'; else if (S.chatChannel === 'ai') S.chatChannel = 'all'; render(); return; }
  if (document.getElementById('app').classList.contains('nav-open') && !t.closest('.sidebar')) document.getElementById('app').classList.remove('nav-open');
});
document.addEventListener('change', ev => {
  const c = ev.target.closest('[data-wb]');
  if (c) { (S.wbChecks[c.dataset.wb] ||= {})[c.dataset.i] = c.checked; }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'quickadd') { const v = document.getElementById('qa').value.trim(); if (v) quickAdd(v); }
  if (ev.target.id === 'composer') {
    const inp = document.getElementById('composer-input'); const v = inp.value.trim(); if (!v) return;
    if (S.chatChannel === 'ai') ask(v);
    else if (S.chatChannel !== 'all') {
      const ents = Object.keys(ENTITIES).filter(id => ENTITIES[id].aliases.some(al => v.toLowerCase().includes(al)));
      const prev = ITEMS.find(i => i.type === 'slack' && i.channel === S.chatChannel);
      ITEMS.push({ id: 's-' + Date.now(), type: 'slack', channel: S.chatChannel, dm: prev?.dm, from: 'robert', time: ymd(S.clock) + 'T' + hm(S.clock), entities: ents.length ? ents : (prev?.entities || []), title: v });
      render(); toast('Bericht toegevoegd (demo, niet naar Slack verstuurd)');
    }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.target.id === 'composer-input' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); ev.target.form.requestSubmit(); }
});

S.route = routeFromHash();
render();
</script>
