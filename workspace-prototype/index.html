<title>Home Zero Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: macOS-style three panes — sidebar (bronnen, views, partners) | werkvlak | contextpaneel. ⌘K-palet zweeft erboven. */
:root {
  --bg: #F4F6F3;
  --panel: #FFFFFF;
  --sidebar: #ECEFEA;
  --fg: #18211C;
  --muted: #59645D;
  --faint: #879189;
  --line: #DCE1DA;
  --hover: #E5E9E3;
  --accent: #1D6A4C;
  --accent-fg: #FFFFFF;
  --accent-soft: #DDEFE5;
  --warn: #A85A0B;
  --warn-soft: #FBEBD6;
  --add: #E3F4E8;
  --del: #FBE4E1;
  --c-mail: #C2410C;
  --c-slack: #7B3A82;
  --c-meeting: #2F5FD0;
  --c-context: #1D6A4C;
  --c-task: #A86B12;
  --c-file: #0E7490;
  --shadow: 0 24px 60px -12px rgba(20, 35, 27, .28), 0 0 0 1px rgba(20, 35, 27, .06);
  --font-ui: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --panel: #161B18; --sidebar: #0C0F0D; --fg: #E5EBE6; --muted: #9DA7A0; --faint: #6E7972;
    --line: #262E29; --hover: #1E2521; --accent: #5BC394; --accent-fg: #0C1410; --accent-soft: #183327;
    --warn: #F0A848; --warn-soft: #33250F; --add: #16301F; --del: #3A1C19;
    --c-mail: #F08A5D; --c-slack: #C98BD0; --c-meeting: #7FA2F2; --c-context: #5BC394; --c-task: #E4B355; --c-file: #4CC3DB;
    --shadow: 0 24px 60px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --panel: #161B18; --sidebar: #0C0F0D; --fg: #E5EBE6; --muted: #9DA7A0; --faint: #6E7972;
  --line: #262E29; --hover: #1E2521; --accent: #5BC394; --accent-fg: #0C1410; --accent-soft: #183327;
  --warn: #F0A848; --warn-soft: #33250F; --add: #16301F; --del: #3A1C19;
  --c-mail: #F08A5D; --c-slack: #C98BD0; --c-meeting: #7FA2F2; --c-context: #5BC394; --c-task: #E4B355; --c-file: #4CC3DB;
  --shadow: 0 24px 60px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-size: 12px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* App shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }
.app.has-inspector { grid-template-columns: 236px minmax(0, 1fr) 360px; }

.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: 10px; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 14px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: -.02em; }
.brand b { font-weight: 600; font-size: 14px; }
.brand div span { display: block; font-size: 11px; color: var(--faint); }
.searchbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; color: var(--faint); margin-bottom: 14px; }
.searchbtn:hover { color: var(--muted); }
.searchbtn > span:not(.kbd) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.searchbtn .kbd { margin-left: auto; }
.kbd { font-family: var(--font-mono); font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--bg); line-height: 18px; }
.nav { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.nav-group { display: flex; flex-direction: column; gap: 1px; }
.nav-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 0 9px 4px; display: flex; justify-content: space-between; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 5px 9px; border-radius: 7px; color: var(--muted); text-align: left; width: 100%; }
.nav-item:hover { background: var(--hover); color: var(--fg); }
.nav-item.active { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--line); font-weight: 500; }
.nav-item .count { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav-item .count.hot { color: var(--warn); font-weight: 600; }
.nav-item .q { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); margin-left: auto; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sources { border-top: 1px solid var(--line); padding: 10px 9px 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--faint); }
.sources .sd { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.main { min-width: 0; min-height: 0; overflow-y: auto; background: var(--bg); }
.topbar { display: none; }
.page { padding-block: 26px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1180px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.eyebrow { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 2px 0 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); }

.inspector { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; padding-block: 18px 40px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Shared bits */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.card-body { padding: 12px 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.chip.entity { background: var(--accent-soft); color: var(--accent); font-weight: 500; cursor: pointer; }
.chip.entity:hover { filter: brightness(.97); }
.chip.warn { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.chip.ok { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip.plan { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; }
.src-mail { color: var(--c-mail); } .src-slack { color: var(--c-slack); } .src-meeting { color: var(--c-meeting); }
.src-context { color: var(--c-context); } .src-task { color: var(--c-task); } .src-file { color: var(--c-file); }
.ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--hover); }
.ic.mail { color: var(--c-mail); } .ic.slack { color: var(--c-slack); } .ic.meeting { color: var(--c-meeting); }
.ic.context { color: var(--c-context); } .ic.task { color: var(--c-task); } .ic.file { color: var(--c-file); }
.row { display: flex; align-items: flex-start; gap: 11px; padding: 9px 10px; border-radius: 9px; cursor: pointer; text-align: left; width: 100%; }
.row:hover, .row.sel { background: var(--hover); }
.row-main { min-width: 0; flex: 1; }
.row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-title.unread::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c-meeting); margin-right: 7px; vertical-align: 1px; }
.row-sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 1px; }
.list { display: flex; flex-direction: column; gap: 1px; }
.group-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 14px 10px 4px; display: flex; align-items: center; gap: 8px; }
.group-label:first-child { padding-top: 4px; }
.empty { color: var(--faint); padding: 20px 10px; text-align: center; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; color: #fff; }

/* Vandaag */
.banner { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--fg); margin-bottom: 18px; flex-wrap: wrap; }
.banner .ic { background: var(--panel); color: var(--warn); }
.banner .row-main { min-width: 200px; }
.timeline { position: relative; padding: 6px 14px 12px 58px; }
.tl-hour { position: relative; height: 46px; border-top: 1px solid var(--line); }
.tl-hour span { position: absolute; left: -46px; top: -8px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; width: 38px; text-align: right; }
.tl-event { position: absolute; left: 58px; right: 14px; border-radius: 8px; padding: 6px 10px; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 2px; border-left: 3px solid var(--c-meeting); background: color-mix(in srgb, var(--c-meeting) 10%, var(--panel)); }
.tl-event:hover { background: color-mix(in srgb, var(--c-meeting) 16%, var(--panel)); }
.tl-event.past { opacity: .78; }
.tl-event.short { flex-direction: row; align-items: center; gap: 10px; padding-block: 2px; }
.tl-event b { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-event .t { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.now-line { position: absolute; left: 50px; right: 6px; height: 0; border-top: 2px solid var(--c-mail); z-index: 2; }
.now-line::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--c-mail); }
.brief li { margin-bottom: 6px; }
.brief { margin: 0; padding-left: 18px; color: var(--fg); }

/* Agenda */
.week { display: grid; grid-template-columns: 48px repeat(5, minmax(120px, 1fr)); min-width: 680px; }
.week-wrap { overflow-x: auto; }
.wk-head { padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.wk-head b { display: block; font-size: 18px; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.wk-head.today b { color: var(--accent); }
.wk-col { position: relative; border-left: 1px solid var(--line); }
.wk-hours { position: relative; }
.wk-hl { height: 44px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--faint); text-align: right; padding-right: 6px; font-variant-numeric: tabular-nums; }
.wk-ev { position: absolute; left: 4px; right: 4px; border-radius: 7px; padding: 4px 7px; font-size: 12px; cursor: pointer; overflow: hidden; border-left: 3px solid var(--c-meeting); background: color-mix(in srgb, var(--c-meeting) 11%, var(--panel)); }
.wk-ev b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-ev .state { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.wk-ev.pending { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.wk-ev.done { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Meeting page */
.meta-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
.people { display: flex; gap: 6px; flex-wrap: wrap; }
.person { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 9px 2px 2px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.person .avatar { width: 20px; height: 20px; font-size: 9px; }
.wb-section { padding: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.wb-section:first-child { border-top: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check .who { color: var(--faint); font-size: 12px; white-space: nowrap; }
.diff { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.diff-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.diff pre { margin: 0; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.diff .ln { display: block; padding: 0 10px; white-space: pre; }
.diff .ln.add { background: var(--add); }
.diff .ln.del { background: var(--del); text-decoration: line-through; color: var(--muted); }
.diff .ln.ctx { color: var(--muted); }
.committed { display: flex; gap: 12px; align-items: center; padding: 14px; background: var(--accent-soft); border-radius: 12px; color: var(--fg); flex-wrap: wrap; }
.committed .ic { background: var(--panel); color: var(--accent); }
.answer-q { background: var(--bg); border-radius: 9px; padding: 9px 11px; font-size: 13px; }

/* Entity */
.entity-hero { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.entity-logo { width: 52px; height: 52px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 20px; font-weight: 700; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.facts dt { color: var(--faint); }
.facts dd { margin: 0; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.count-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
.count-pill b { font-variant-numeric: tabular-nums; }
.repo-path { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

/* Chat */
.chat { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100%; min-height: 0; }
.chat-list { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 8px; background: var(--bg); }
.chat-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.chat-head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.msgs { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; max-width: 760px; }
.msg-body { min-width: 0; }
.msg-meta { font-size: 12px; color: var(--faint); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msg-meta b { color: var(--fg); font-size: 13.5px; font-weight: 600; }
.msg-text { margin-top: 2px; overflow-wrap: anywhere; }
.msg.ai .avatar { background: var(--accent); color: var(--accent-fg); }
.msg.ai .msg-text { background: var(--accent-soft); padding: 10px 12px; border-radius: 4px 12px 12px 12px; }
.msg.ai .msg-text ul { margin: 6px 0; padding-left: 18px; }
.sources-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.composer { border-top: 1px solid var(--line); padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 8px; }
.composer-box { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; background: var(--bg); }
.composer-box textarea { flex: 1; border: 0; background: transparent; resize: none; outline: none; min-height: 22px; max-height: 120px; }
.seg { display: inline-flex; background: var(--hover); border-radius: 8px; padding: 2px; }
.seg button { padding: 3px 10px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }
.mention { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 3px; font-weight: 500; cursor: pointer; }

/* Query bar + list view */
.qbar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; margin-bottom: 16px; }
.qbar input { flex: 1; border: 0; outline: none; background: transparent; font-family: var(--font-mono); font-size: 13px; min-width: 0; }
.tok { font-family: var(--font-mono); font-size: 12px; }
.tok-key { color: var(--accent); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 14px; }

/* Activity */
.quickadd { display: flex; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; align-items: center; margin-bottom: 8px; }
.quickadd input { flex: 1; border: 0; outline: none; background: transparent; min-width: 0; }
.hint { font-size: 12px; color: var(--faint); margin: 0 0 18px; }

/* Inspector */
.insp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.insp-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 6px 0 4px; text-wrap: balance; }
.insp-body { white-space: pre-wrap; color: var(--fg); background: var(--bg); border-radius: 10px; padding: 12px; margin: 12px 0; font-size: 13px; overflow-wrap: anywhere; }
.insp-body.md { font-family: var(--font-mono); font-size: 12px; }
.insp-section { margin-top: 18px; }
.insp-section h2 { margin-bottom: 6px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.iconbtn { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--hover); color: var(--fg); }

/* Palette */
.scrim { position: fixed; inset: 0; background: rgba(12, 20, 16, .32); z-index: 50; display: flex; justify-content: center; align-items: flex-start; padding-top: max(10vh, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.palette { width: 100%; max-width: 680px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 76vh; overflow: hidden; animation: pop .14s ease-out; }
@keyframes pop { from { transform: translateY(-6px) scale(.985); opacity: .4; } }
.pal-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.pal-input input { flex: 1; border: 0; outline: none; background: transparent; font-size: 16px; min-width: 0; }
.pal-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px 0; }
.pal-chips:empty { display: none; }
.pal-results { overflow-y: auto; padding: 6px 8px 8px; }
.pal-item { display: flex; gap: 11px; align-items: center; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.pal-item.active { background: var(--hover); }
.pal-item .row-main { min-width: 0; }
.pal-item .enter { margin-left: auto; opacity: 0; }

const watching = new Set();
function watch(key, server, tool, input, onData, interval = 300000) {
  const id = key + JSON.stringify(input);
  if (watching.has(id)) return; watching.add(id);
  ST[key] = 'loading';
  const retry = () => CAP.mcp.callTool(server, tool, input).then(r => { onData(r.payload); ST[key] = 'ok'; LV.updated[key] = Date.now(); scheduleRender(); })
    .catch(e => { ST[key] = { code: e?.code || 'upstream_error', message: e?.message || '', server, retry }; scheduleRender(); });
  CAP.mcp.watchTool(server, tool, input, ev => {
    if (ev.type === 'data') {
      try { onData(ev.result.payload); ST[key] = 'ok'; LV.updated[key] = ev.result.cache?.storedAt || Date.now(); }
      catch (e) { console.error(key, e); ST[key] = { code: 'parse', message: 'Onverwacht antwoord van ' + server, server, retry }; }
    } else {
      const c = ev.error?.code || 'upstream_error';
      if (DENY.includes(c)) { try { onData(null); } catch {} }
      ST[key] = { code: c, message: ev.error?.message || '', server, retry };
    }
    scheduleRender();
  }, { cache: { staleTime: 60000, gcTime: 900000 }, refetchInterval: interval });
}

function parseSlack(payload) {
  const txt = typeof payload === 'string' ? payload : (payload?.results || '');
  return txt.split(/^### Result \d+ of \d+\s*$/m).slice(1).map(p => {
    const g = re => (p.match(re) || [])[1];
    const chan = p.match(/^Channel: (.+?) \(ID: (\w+)\)/m) || [];
    const from = p.match(/^From: (.*?)(?: <([^>]+)>)? \(ID: (\w+)\)(.*)$/m) || [];
    const ts = g(/^Message_ts: ([\d.]+)/m);
    const timeStr = g(/^Time: (.+)$/m);
    const parts = g(/^Participants: (.+)$/m) || '';
    const others = [...parts.matchAll(/([^,(]+?) \(ID: (\w+)\)/g)].filter(m => m[2] !== SLACK_ME).map(m => m[1].trim());
    const ti = p.indexOf('\nText:');
    const raw = (ti >= 0 ? p.slice(ti + 6) : '').replace(/\n---\s*$/, '').trim();
    let time = ts ? new Date(parseFloat(ts) * 1000) : null;
    if (!time && timeStr) { const m = timeStr.match(/^(\S+) (\S+) (CEST|CET)/); if (m) time = new Date(`${m[1]}T${m[2]}${m[3] === 'CEST' ? '+02:00' : '+01:00'}`); }
    const isDm = /^DM/.test(chan[1] || '') || /^Group/.test(chan[1] || '');
    return {
      ts, channelId: chan[2], channelName: isDm ? 'DM ' + (others.join(', ') || from[1] || '') : (chan[1] || ''), dm: isDm,
      fromName: (from[1] || '').trim() || 'Slack', fromId: from[3], bot: /\[BOT\]/.test(from[4] || ''),
      time: time ? time.toISOString() : null, url: g(/^Permalink: \[link\]\((.+?)\)/m), thread: /thread_ts=/.test(g(/^Permalink: \[link\]\((.+?)\)/m) || ''),
      text: cleanSlack(raw),

  });
}

  };
  LV.slack.dm.forEach(s => addSlack(s, 'dm'));
  LV.slack.mention.forEach(s => addSlack(s, 'mention'));
  mine.forEach(s => addSlack(s, 'mine'));
  // Taken
  const tseen = new Set();
  [...LV.tasks.overdue.map(t => ({ ...t, overdue: true })), ...LV.tasks.today].forEach(t => {
    if (tseen.has(t.id)) return; tseen.add(t.id);
    items.push({ id: 'tk:' + t.id, rawId: t.id, tasklist: t.tasklist_id, type: 'task', live: true, title: t.title || '(taak)', due: t.due ? String(t.due).slice(0, 10) : null, overdue: !!t.overdue, list: t.tasklist_title, entities: [], url: 'https://tasks.google.com/' });
  });
  // Herken organisaties in tekst (bijv. "TonZon" in een Slack-bericht)
  const slugs = Object.keys(ORGS).filter(s => s.length >= 4);
  for (const it of items) {
    if (it.entities.length) continue;
    const hay = String(it.title + ' ' + (it.body || '')).toLowerCase().slice(0, 4000);
    it.entities = slugs.filter(s => new RegExp('\\b' + s).test(hay)).slice(0, 2);
  }
  LIVE_ITEMS = items.concat(commitItems());
}
function commitStatus(c) {
  if (c.status === 'open' && c.deadline && c.deadline < today()) return 'te_laat';
  return c.status || 'open';
}
function commitOrgId(c) {
  const n = normOrg(c.org);
  if (!n) return null;
  const E = ENT();
  return Object.keys(E).find(k => k === n || normOrg(E[k].name) === n || n.includes(k) || k.includes(n)) || (MODE.live ? registerOrg(n, c.org) : null);
}
function commitItems() {
  return LV.commits.map(c => {
    const org = commitOrgId(c);
    return { id: 'cm:' + c.id, docId: c.id, type: 'commit', title: c.wat, stroom: c.stroom, aan: c.aan, status: commitStatus(c), deadline: c.deadline, due: c.deadline,
      time: c.created ? c.created + 'T09:00' : null, body: [c.aan, c.bron?.label, c.bewijs].filter(Boolean).join(' · '), raw: c, entities: org ? [org] : [] };
  });
}

/* ---------- Waar moet je aandacht naartoe ---------- */
function focusDay() {
  const evs = allItems().filter(i => i.type === 'meeting' && !i.allDay && !i.ooo);
  for (let k = 0; k < 8; k++) {
    const day = ymd(addDays(S.clock, k));
    const list = evs.filter(e => ymd(pd(e.start)) === day && (k > 0 || pd(e.end) > S.clock));
    if (list.length) return { day, k, list: evs.filter(e => ymd(pd(e.start)) === day).sort((a, b) => when(a) - when(b)) };
  }
  return { day: today(), k: 0, list: [] };
}
function openCommits() { return allItems().filter(i => i.type === 'commit' && !['klaar', 'overgedragen'].includes(i.status)); }
function slackToAnswer() {
  return allItems().filter(i => i.type === 'slack' && !i.fromMe && !i.answered && !i.bot && (i.dm || i.mention)).sort((a, b) => when(b) - when(a));
}
function attention() {
  const out = [];
  const add = (score, kind, it, why, acts = []) => out.push({ score, kind, it, why, acts });
  const fd = focusDay();
  const oc = openCommits();
  // Te late / vandaag te leveren toezeggingen
  oc.forEach(c => {
    if (c.status === 'te_laat') add(92 - Math.min(10, -dayDiff(pd(c.deadline))), 'late', c, `${STROOM[c.stroom] || ''}${c.aan ? ' · ' + c.aan : ''} · deadline was ${fmtDate(c.deadline)}`);
    else if (c.deadline && dayDiff(pd(c.deadline)) <= 1 && c.status === 'open') add(78, 'commit', c, `${STROOM[c.stroom]}${c.aan ? ' · ' + c.aan : ''} · deadline ${dayLabel(pd(c.deadline)).toLowerCase()}`);
    else if (c.status === 'waarschijnlijk_klaar') add(40, 'commit', c, `Bewijs gevonden: ${c.raw?.bewijs || 'controleer en vink af'}`);
  });
  // De vanger: externe afspraak met open toezeggingen
  fd.list.filter(m => m.external && pd(m.end) > S.clock).forEach((m, idx) => {
    const open = oc.filter(c => c.entities.some(e => m.entities.includes(e)));
    const hrs = (pd(m.start) - S.clock) / 36e5;
    if (open.length) add(88 - idx * 3, 'prep', m, `${dayLabel(pd(m.start))} ${hm(pd(m.start))} · ${open.length} open ${open.length === 1 ? 'toezegging' : 'toezeggingen'} bij ${m.entities.map(entityName).join(', ')}`);
    else if (idx < 2) add(hrs < 3 ? 70 : 56 - idx * 4, 'prep', m, `${dayLabel(pd(m.start))} ${hm(pd(m.start))} · extern met ${m.entities.map(entityName).join(', ')}`);
  });
  // Uitnodigingen
  allItems().filter(i => i.type === 'meeting' && i.needsAction && pd(i.end || i.start) > S.clock).forEach(m => {
    const days = Math.max(0, dayDiff(pd(m.start)));
    add(76 - Math.min(days, 7) * 3, 'invite', m, `Uitnodiging van ${m.organizerName || 'onbekend'} · ${dayLabel(pd(m.start))} ${m.allDay ? '' : hm(pd(m.start))}`);
  });
  // Slack waar iemand op je wacht
  slackToAnswer().forEach(s => {
    const q = /\?/.test(s.title);
    const ageH = (S.clock - when(s)) / 36e5;
    add((s.dm ? 72 : 64) + (q ? 6 : 0) - Math.min(12, ageH / 12), 'reply', s, `${s.dm ? 'DM' : 'Noemt je in ' + s.channel} · ${s.fromName} · ${dayLabel(when(s))} ${hm(when(s))}`);
  });
  // Mail direct aan jou
  allItems().filter(i => i.type === 'mail' && i.direct).forEach(m => add(62, 'reply', m, `Mail aan jou · ${m.fromName}`));
  // Taken
  allItems().filter(i => i.type === 'task').forEach(t => add(t.overdue ? 60 : 50, 'task', t, t.overdue ? `Over tijd sinds ${t.due ? fmtDate(t.due) : '–'}` : 'Staat voor vandaag'));
  return out.sort((a, b) => b.score - a.score);
}

/* ---------- Query engine (⌘K en views) ---------- */
const TYPE_ALIAS = { mail: 'mail', email: 'mail', inbox: 'mail', slack: 'slack', chat: 'slack', meeting: 'meeting', meetings: 'meeting', afspraak: 'meeting', agenda: 'meeting',
  context: 'context', taak: 'task', taken: 'task', task: 'task', commit: 'commit', toezegging: 'commit', toezeggingen: 'commit', commitments: 'commit', drive: 'file' };
function parseQuery(q) {
  const out = { types: [], entities: [], from: [], in: [], when: null, is: [], text: [] };
  for (const raw of q.trim().split(/\s+/).filter(Boolean)) {
    const tok = raw.toLowerCase(); let m;
    if (tok.startsWith('@') && tok.length > 1) out.entities.push(tok.slice(1));
    else if ((m = tok.match(/^(type|bron|from|van|in|when|wanneer|is|org|partner):(.+)$/))) {
      const [, k, v] = m;
      if (k === 'type' || k === 'bron') { const t = TYPE_ALIAS[v]; if (t) out.types.push(t); }
      else if (k === 'from' || k === 'van') out.from.push(v);
      else if (k === 'in') out.in.push(v);
      else if (k === 'when' || k === 'wanneer') out.when = v;
      else if (k === 'is') out.is.push(v);
      else out.entities.push(v);
    } else out.text.push(tok);
  }
  return out;
}
function matchEntityToken(tok) {
  const E = ENT(); tok = tok.toLowerCase();
  return Object.keys(E).filter(id => id.startsWith(tok) || (E[id].aliases || []).some(a => a.startsWith(tok)) || E[id].name.toLowerCase().includes(tok));
}
function haystack(it) {
  return [it.title, it.body, it.channel, it.fromName, it.aan, it.desc, ...(it.attendeeNames || []), ...(it.entities || []).map(e => ENT()[e]?.name || e)].join(' ').toLowerCase();
}
function runQuery(q) {
  const p = parseQuery(q);
  const entIds = p.entities.flatMap(matchEntityToken);
  const res = allItems().filter(it => {
    if (p.types.length && !p.types.includes(it.type)) return false;
    if (p.entities.length && !(it.entities || []).some(e => entIds.includes(e))) return false;
    if (p.from.length && !p.from.some(f => String(it.fromName || it.organizerName || it.aan || '').toLowerCase().includes(f))) return false;
    if (p.in.length && !(it.channel && p.in.some(c => it.channel.toLowerCase().includes(c.replace(/^#/, ''))))) return false;
    if (p.when) {
      if (it.nodate) return false;
      const diff = dayDiff(when(it));
      if ((p.when === 'vandaag' || p.when === 'today') && diff !== 0) return false;
      if (p.when === 'morgen' && diff !== 1) return false;
      if ((p.when === 'week' || p.when === 'deze-week') && (diff < -6 || diff > 6)) return false;
      if (p.when === 'gisteren' && diff !== -1) return false;
      if (p.when === 'komend' && when(it) < S.clock) return false;
    }
    for (const f of p.is) {
      if (f === 'open' && (it.type === 'commit' ? ['klaar', 'overgedragen'].includes(it.status) : it.type === 'task' ? false : !(it.unread || it.needsAction))) return false;
      if (f === 'unread' && !it.unread) return false;
      if (f === 'direct' && !it.direct) return false;
      if (f === 'invite' && !it.needsAction) return false;
      if (f === 'extern' && !it.external) return false;
      if (f === 'reageren' && !((it.type === 'slack' && !it.fromMe && !it.answered && !it.bot && (it.dm || it.mention)) || (it.type === 'mail' && it.direct))) return false;
      if (STATUS[f] && it.status !== f) return false;
      if (STROOM[f] && it.stroom !== f) return false;
    }
    if (p.text.length) { const h = haystack(it); if (!p.text.every(w => h.includes(w))) return false; }
    return true;

  res.sort((a, b) => (a.nodate - b.nodate) || when(b) - when(a));

}

/* ---------- Routing ---------- */
function routeFromHash() {
  const h = location.hash.slice(1);
  if (!h || h === 'dagstart') return { view: 'dagstart' };
  if (['agenda', 'chat', 'toezeggingen', 'wegschrijven'].includes(h)) return { view: h };
  if (h.startsWith('o-')) return { view: 'entity', id: h.slice(2) };
  const b = BUILTIN_VIEWS.find(v => v.id === h); if (b) return { view: 'list', q: b.q, title: b.name, key: b.id };
  const s = S.saved.find(v => v.id === h); if (s) return { view: 'list', q: s.q, title: s.name, key: s.id, saved: true };
  return { view: 'dagstart' };
}
const hashFor = r => r.view === 'entity' ? 'o-' + r.id : r.view === 'list' ? (r.key || '') : r.view;
function go(r) {
  S.route = r;
  const h = hashFor(r);
  if (h && location.hash.slice(1) !== h) { S.skipHash = h; try { location.hash = h; } catch {} }
  document.getElementById('app').classList.remove('nav-open');
  render();
  document.getElementById('main').scrollTop = 0;
}
window.addEventListener('hashchange', () => { if (location.hash.slice(1) === S.skipHash) { S.skipHash = null; return; } S.route = routeFromHash(); render(); });

      <div class="card"><div class="card-head"><h2>Taken<span class="count-badge">${tasks.length}</span></h2>${extLink('https://tasks.google.com/', ic('out') + 'Google Tasks')}</div>
        <div class="card-body" style="padding:6px">${sectionNote(['tasksToday', 'tasksOverdue'])}
          ${tasks.length ? `<div class="list">${tasks.map(t => `<div class="row" style="cursor:default"><span class="ic task">${ic('task')}</span><span class="row-main"><span class="row-title" style="display:block">${esc(t.title)}</span><span class="row-sub" style="display:block">${esc(itemSub(t))}</span></span>${S.busy[t.id] ? '<span class="sub">…</span>' : `<button class="btn sm" data-action="t-done" data-id="${esc(t.id)}">${ic('check')}</button>`}</div>`).join('')}</div>` : MODE.checked ? '<div class="empty">Geen taken voor vandaag.</div>' : ''}</div></div>
    </div>
  </div>`;
}

/* ---------- Agenda (week) ---------- */
function viewAgenda() {
  const weekend = [0, 6].includes(S.clock.getDay());
  const base = weekStart(S.weekOffset + (weekend ? 1 : 0));
  if (MODE.live) ensureCalRange(base, 7);
  const days = Array.from({ length: 5 }, (_, i) => addDays(base, i));
  const H0 = 8, H1 = 19, PX = 44;
  const evs = allItems().filter(i => i.type === 'meeting');
  const oc = openCommits();
  const wk = (() => { const t = new Date(Date.UTC(base.getFullYear(), base.getMonth(), base.getDate() + 3)); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 4)); return 1 + Math.round(((t - y) / 864e5 - 3 + ((y.getUTCDay() + 6) % 7)) / 7); })();
  return `<div class="page">${modeBanner()}
    <div class="page-head"><div><div class="eyebrow">Google Agenda · week ${wk}</div><h1>${days[0].getDate()} ${days[0].getMonth() !== days[4].getMonth() ? MONTHS[days[0].getMonth()].slice(0, 3) + ' ' : ''}– ${days[4].getDate()} ${MONTHS[days[4].getMonth()]}</h1></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="legend"><span><span class="dot" style="background:var(--c-mail)"></span>Extern</span><span><span class="dot" style="border:1.5px dashed var(--c-meeting)"></span>Nog niet geaccepteerd</span><span><b style="color:var(--c-commit)">●</b> open toezeggingen</span></div>
        <button class="iconbtn" data-action="week" data-dir="-1" aria-label="Vorige week">${ic('chevL')}</button><button class="btn sm" data-action="week" data-dir="0">Deze week</button><button class="iconbtn" data-action="week" data-dir="1" aria-label="Volgende week">${ic('chevR')}</button>
      </div></div>
    ${sectionNote(Object.keys(ST).filter(k => k.startsWith('cal:')))}
    <div class="card week-wrap"><div class="week">
      <div class="wk-head"></div>${days.map(dt => `<div class="wk-head${ymd(dt) === today() ? ' today' : ''}">${DAYS[dt.getDay()].slice(0, 2)}<b>${dt.getDate()}</b></div>`).join('')}
      <div class="wk-allday" style="border-right:0"></div>${days.map(dt => `<div class="wk-allday" style="border-left:1px solid var(--line)">${evs.filter(e => e.allDay && ymd(pd(e.start)) <= ymd(dt) && ymd(dt) < ymd(pd(e.end))).map(e => `<span data-open="${esc(e.id)}" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}</div>`).join('')}
      <div class="wk-hours">${Array.from({ length: H1 - H0 }, (_, i) => `<div class="wk-hl">${H0 + i}:00</div>`).join('')}</div>
      ${days.map(dt => {
        const list = evs.filter(e => !e.allDay && ymd(pd(e.start)) === ymd(dt)).sort((a, b) => when(a) - when(b));
        return `<div class="wk-col">${Array.from({ length: H1 - H0 }, () => '<div class="wk-hl"></div>').join('')}
          ${list.map((m, idx) => {
            const s = pd(m.start), e = pd(m.end);
            const top = Math.max(0, ((s.getHours() + s.getMinutes() / 60) - H0) * PX);
            const h = Math.max(Math.min(((e - s) / 36e5) * PX, (H1 - H0) * PX - top) - 3, 20);
            const overlap = list.filter(o => o !== m && pd(o.start) < e && pd(o.end) > s);
            const lane = overlap.length ? list.filter(o => (o === m || overlap.includes(o))).indexOf(m) : 0;
            const lanes = overlap.length + 1;
            const nOpen = oc.filter(c => c.entities.some(x => m.entities.includes(x))).length;
            const cls = [m.needsAction ? 'inv' : '', m.ooo ? 'ooo' : '', m.focusTime ? 'focus-t' : '', m.external ? 'ext' : ''].join(' ');
            return `<div class="wk-ev ${cls}" data-open="${esc(m.id)}" style="top:${top}px;height:${h}px;left:calc(${(lane / lanes) * 100}% + 3px);width:calc(${100 / lanes}% - 6px);right:auto" title="${esc(m.title)}"><b>${esc(m.title)}</b>${h > 34 ? `<span class="state">${hm(s)}${m.external ? ' · ' + esc(m.entities.map(entityName).join(', ')) : ''}${nOpen ? ` · <b style="display:inline;color:var(--c-commit)">${nOpen} open</b>` : ''}</span>` : nOpen ? `<span class="cb">${nOpen}</span>` : ''}</div>`;
          }).join('')}
          ${ymd(dt) === today() && S.clock.getHours() >= H0 && S.clock.getHours() < H1 ? `<div class="now-line" style="left:0;right:0;top:${((S.clock.getHours() + S.clock.getMinutes() / 60) - H0) * PX}px"></div>` : ''}</div>`;
      }).join('')}
    </div></div>
    <p class="hint" style="margin-top:12px">Klik op een afspraak voor deelnemers, je reactie, open toezeggingen bij die organisatie en alles wat er recent over binnenkwam.</p></div>`;
}

/* ---------- Toezeggingen (commitment tracker) ---------- */
function viewToezeggingen() {
  const cs = commitItems();
  const tabs = [['mijn', 'Ik beloofde'], ['aan_mij', 'Aan mij beloofd'], ['voornemen', 'Eigen voornemens'], ['afgerond', 'Afgerond']];
  const isDone = c => ['klaar', 'overgedragen'].includes(c.status);
  const list = S.commitTab === 'afgerond' ? cs.filter(isDone) : cs.filter(c => c.stroom === S.commitTab && !isDone(c));
  const order = { te_laat: 0, waarschijnlijk_klaar: 1, open: 2, klaar: 3, overgedragen: 4 };
  list.sort((a, b) => order[a.status] - order[b.status] || String(a.deadline || '9999').localeCompare(String(b.deadline || '9999')));
  const wisprTodo = MODE.live ? LV.wispr.filter(m => !LV.processed.has(m.id) && new Date(m.end || m.start) < S.clock) : [];
  const ruleText = r => !r || r.type === 'geen' ? '<span class="rule none">geen bewijsregel · dit vink je zelf af</span>' : `<span class="rule">bewijs: ${esc(r.type)}${r.to ? ' → ' + esc(r.to) : ''}${r.keywords?.length ? ' · ' + esc(r.keywords.join(', ')) : ''}</span>`;
  return `<div class="page">${modeBanner()}
    <div class="page-head"><div><div class="eyebrow">Commitment tracker</div><h1>Toezeggingen</h1><div class="sub" style="margin-top:4px;max-width:66ch">Wat jij toezegt, wat anderen jou toezeggen en je eigen voornemens. Bewijs in je verzonden mail, Slack of agenda zet een item op ‘waarschijnlijk klaar’. Jij bevestigt of maakt bezwaar.</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-action="extract-scan">${ic('spark')}Haal op uit Slack en mail</button><button class="btn" data-action="sweep" ${S.busy.sweep ? 'disabled' : ''}>${ic('check')}${S.busy.sweep ? 'Bewijs zoeken…' : 'Zoek bewijs'}</button></div></div>
    ${statusRow()}${sectionNote(['commits'])}
    <form class="addform" id="addcommit"><input id="ac-wat" placeholder="Nieuwe toezegging, bijv. ‘DNS-instructies naar Liselot sturen’" autocomplete="off" required>
      <select id="ac-stroom" aria-label="Stroom"><option value="mijn">Ik beloofde</option><option value="aan_mij">Aan mij</option><option value="voornemen">Voornemen</option></select>
      <input id="ac-date" type="date" aria-label="Deadline"><button class="btn sm primary" type="submit">${ic('plus')}Toevoegen</button></form>
    ${wisprTodo.length ? `<div class="card" style="margin-bottom:16px"><div class="card-head"><h2>${ic('mic')} Recente meetings om te verwerken<span class="count-badge">${wisprTodo.length}</span></h2></div><div class="card-body" style="padding:6px">${wisprTodo.map(m => `<div class="row" style="cursor:default;align-items:center"><span class="ic meeting">${ic('mic')}</span><span class="row-main"><span class="row-title" style="display:block">${esc(m.title)}</span><span class="row-sub" style="display:block">${dayLabel(new Date(m.start))} ${hm(new Date(m.start))} · ${esc((m.attendees || []).slice(0, 4).join(', '))}</span></span><button class="btn sm primary" data-action="extract-m" data-id="${esc(m.id)}">${ic('spark')}Haal eruit</button><button class="btn sm" data-action="skip-m" data-id="${esc(m.id)}">Overslaan</button></div>`).join('')}</div></div>` : ''}
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => { const n = k === 'afgerond' ? cs.filter(isDone).length : cs.filter(c => c.stroom === k && !isDone(c)).length; return `<button class="tab${S.commitTab === k ? ' on' : ''}" role="tab" data-ctab="${k}">${l}<span class="count-badge">${n}</span></button>`; }).join('')}</div>
    <div class="card">${list.length ? list.map(c => `<div class="commit-row">
        <div style="min-width:0"><div class="wat">${esc(c.title)}</div>
          <div class="meta"><span class="st st-${c.status}">${STATUS[c.status]}</span>${c.aan ? `<span>${S.commitTab === 'aan_mij' ? 'van' : 'aan'} ${esc(c.aan)}</span>` : ''}${c.entities.map(entityChip).join('')}${c.deadline ? `<span style="${c.status === 'te_laat' ? 'color:var(--danger);font-weight:600' : ''}">deadline ${fmtDate(c.deadline)}</span>` : '<span>geen deadline</span>'}<span>${esc(c.raw.bron?.url ? '' : c.raw.bron?.label || '')}</span>${c.raw.bron?.url ? extLink(c.raw.bron.url, esc(c.raw.bron.label), 'ext-link') : ''}</div>
          <div class="meta">${c.raw.bewijs ? `<span class="rule" style="color:var(--c-commit)">✓ ${esc(c.raw.bewijs)}</span>` : ruleText(c.raw.bewijsregel)}</div>
          ${c.raw.citaat ? `<div class="meta"><i>“${esc(short(c.raw.citaat, 160))}”</i></div>` : ''}</div>
        <div class="commit-acts">${c.status === 'klaar' || c.status === 'overgedragen' ? `<button class="btn sm" data-action="c-reopen" data-id="${esc(c.docId)}">${ic('undo')}Heropen</button>` : `
          <button class="btn sm${c.status === 'waarschijnlijk_klaar' ? ' primary' : ''}" data-action="c-done" data-id="${esc(c.docId)}">${ic('check')}Klaar</button>
          ${c.status === 'waarschijnlijk_klaar' ? `<button class="btn sm" data-action="c-reopen" data-id="${esc(c.docId)}">Bezwaar</button>` : ''}
          <button class="btn sm" data-action="c-hand" data-id="${esc(c.docId)}" title="Wordt een Jira-story: de tracker laat hem los">Naar Jira</button>`}
          <button class="iconbtn" data-action="c-del" data-id="${esc(c.docId)}" aria-label="Verwijder">${ic('trash')}</button></div></div>`).join('')
      : `<div class="empty">${S.commitTab === 'afgerond' ? 'Nog niets afgerond.' : 'Niets in deze stroom. Voeg er hierboven een toe, of laat Claude ze ophalen uit Slack, mail en je meetings.'}</div>`}</div>
    <p class="hint" style="margin-top:12px">Telt als toezegging als er een eigenaar is, iets controleerbaars te leveren, en iemand het merkt als het niet gebeurt. Wordt het een Jira-story, dan laat de tracker hem los.</p></div>`;
}

/* ---------- Organisatie / partner ---------- */
function related(entityIds, excludeId, limit = 8) {
  return allItems().filter(i => i.id !== excludeId && (i.entities || []).some(e => entityIds.includes(e))).sort((a, b) => (a.nodate - b.nodate) || when(b) - when(a)).slice(0, limit);
}
function viewEntity(id) {
  const e = ENT()[id];
  if (!e) return `<div class="page"><div class="empty">Deze organisatie staat niet (meer) in je recente bronnen.</div></div>`;
  const all = allItems().filter(i => (i.entities || []).includes(id));
  const cnt = t => all.filter(i => i.type === t).length;
  const upcoming = all.filter(i => i.type === 'meeting' && pd(i.start) > S.clock).sort((a, b) => when(a) - when(b));
  const commits = all.filter(i => i.type === 'commit' && !['klaar', 'overgedragen'].includes(i.status));
  const timeline = all.filter(i => i.type !== 'commit' && (i.nodate || when(i) <= S.clock)).sort((a, b) => (a.nodate - b.nodate) || when(b) - when(a));
  const people = [...new Set(all.flatMap(i => i.type === 'meeting' ? (i.attendees || []).filter(a => orgSlugFromEmail(a.email) && registerOrg(orgSlugFromEmail(a.email)) === id).map(a => a.name) : i.type === 'mail' && orgSlugFromEmail(i.fromEmail) ? [i.fromName] : []))].slice(0, 8);
  return `<div class="page">${modeBanner()}
    <div class="page-head" style="align-items:flex-start"><div class="entity-hero"><div class="entity-logo" style="background:color-mix(in srgb, ${hashColor(id)} 16%, var(--panel));color:${hashColor(id)}">${esc(e.short.slice(0, 2).toUpperCase())}</div>
      <div><div class="eyebrow">${esc(e.kind)}${e.status ? ' · ' + esc(e.status) : ''}</div><h1>${esc(e.name)}</h1>${e.repo ? `<div class="repo-path mono" style="margin-top:4px">${ic('context')}homezero/context/${esc(e.repo)}/</div>` : `<div class="sub" style="font-size:12.5px;margin-top:4px">Samengesteld uit je agenda, mail en Slack</div>`}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-action="palette-q" data-q="@${esc(id)} ">${ic('search')}Zoek binnen ${esc(e.short)}</button><button class="btn" data-action="ask" data-q="Wat speelt er bij ${esc(e.short)} en wat staat er nog open?">${ic('spark')}Vraag Claude</button></div></div>
    <div class="counts" style="margin-bottom:18px">${TYPE_ORDER.filter(cnt).map(t => `<button class="count-pill" data-action="palette-q" data-q="@${esc(id)} type:${t} "><span class="src src-${t}">${ic(SRC[t].icon)}</span><b>${cnt(t)}</b>${SRC[t].plural}</button>`).join('')}</div>
    <div class="grid2">
      <div class="card"><div class="card-head"><h2>Tijdlijn</h2><span class="sub" style="font-size:12px">alle bronnen</span></div><div class="card-body" style="padding:6px"><div class="list">${timeline.map(rowHTML).join('') || '<div class="empty">Nog niets.</div>'}</div></div></div>
      <div class="stack">
        <div class="card"><div class="card-head"><h2>${ic('commit')} Open toezeggingen</h2><button class="btn sm" data-go="toezeggingen">Tracker</button></div><div class="card-body" style="padding:6px">${commits.length ? `<div class="list">${commits.map(rowHTML).join('')}</div>` : '<div class="empty">Niets open bij ' + esc(e.short) + '.</div>'}</div></div>
        ${upcoming.length ? `<div class="card"><div class="card-head"><h2>Komende afspraken</h2></div><div class="card-body" style="padding:6px"><div class="list">${upcoming.map(rowHTML).join('')}</div></div></div>` : ''}
        <div class="card"><div class="card-head"><h2>${ic('context')} Contextlaag</h2></div><div class="card-body" style="display:flex;flex-direction:column;gap:10px">
          ${e.summary ? `<div>${esc(e.summary)}</div><dl class="facts">${(e.facts || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '<div class="sub">Nog geen context voor deze organisatie. Zodra de contextlaag (GitHub) gekoppeld is, staat hier het profiel, de lopende afspraken en de meetinghistorie.</div>'}

      <form class="composer" id="composer">

          ${!isAI ? '<span class="sub" style="font-size:12px">Antwoorden gaat nog via Slack zelf (link per bericht)</span>' : ''}</div>
        <div class="composer-box"><textarea id="composer-input" rows="1" placeholder="${isAI ? 'Bijv. wat moet ik vandaag nog beantwoorden?' : 'Schakel naar ‘Vraag Claude’ om een vraag te stellen'}" ${!isAI ? 'disabled' : ''}></textarea><button class="btn sm primary" type="submit" aria-label="Verstuur" ${!isAI ? 'disabled' : ''}>${ic('send')}</button></div>
      </form></div></div>`;
}
function aiMessages() {
  if (!S.aiThread.length) {
    const sugg = ['Wat moet ik vandaag nog beantwoorden?', 'Welke toezeggingen lopen het meeste risico?', 'Waar moet ik op letten bij mijn externe afspraken deze week?'];
    return `<div class="msg ai"><span class="avatar">${ic('spark')}</span><div class="msg-body"><div class="msg-meta"><b>Claude</b></div><div class="msg-text">Ik kijk mee in je agenda, ongelezen mail, Slack, taken en toezeggingen. Waar wil je meer over weten?<div class="sources-row">${sugg.map(s => `<button class="btn sm" data-action="ask" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div></div></div>`;
  }
  return S.aiThread.map((m, i) => m.role === 'user'
    ? `<div class="msg">${avatar('Robert Verveen')}<div class="msg-body"><div class="msg-meta"><b>Jij</b></div><div class="msg-text">${esc(m.text)}</div></div></div>`
    : `<div class="msg ai"><span class="avatar">${ic('spark')}</span><div class="msg-body"><div class="msg-meta"><b>Claude</b>${m.demo ? '<span class="demo-tag">voorbeeld</span>' : ''}</div><div class="msg-text" id="ai-msg-${i}" style="white-space:pre-wrap">${esc(m.text) || 'Denkt na…'}</div></div></div>`).join('');
}
function contextDump() {
  const lines = allItems().filter(i => !i.nodate || i.type === 'mail').slice(0, 160).map(i => `[${SRC[i.type].label}${i.time || i.start ? ' ' + ymd(when(i)) + ' ' + hm(when(i)) : ''}] ${short(i.title, 300)} — ${short(itemSub(i), 160)}${i.entities?.length ? ' (' + i.entities.map(entityName).join(', ') + ')' : ''}`);
  return lines.join('\n');
}
async function ask(q) {
  S.chatChannel = 'ai';
  S.aiThread.push({ role: 'user', text: q });
  const msg = { role: 'ai', text: '' }; S.aiThread.push(msg);
  if (S.route.view !== 'chat') go({ view: 'chat' }); else render();
  const scroll = () => { const m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight; };
  requestAnimationFrame(scroll);
  if (!CAP.sample) { msg.demo = true; msg.text = 'In de live versie beantwoordt Claude dit op basis van je agenda, mail, Slack, taken en toezeggingen. Open de pagina in claude.ai om het te proberen.'; return render(); }
  const idx = S.aiThread.length - 1;
  const prev = S.aiThread.slice(0, -2).slice(-4).map(m => (m.role === 'user' ? 'Robert: ' : 'Claude: ') + m.text).join('\n');
  const sys = `Je bent de werkassistent van Robert Verveen (productmanager bij Home Zero). Beantwoord zijn vraag kort en concreet in het Nederlands, alleen op basis van de gegevens hieronder. Noem bronnen bij naam (bijv. "Slack, DM Mike" of "mail van Rens"). Zeg het eerlijk als iets er niet in staat. Nu: ${longDay(S.clock)} ${hm(S.clock)}.\n\nGEGEVENS\n${contextDump()}\n\nOPEN TOEZEGGINGEN\n${openCommits().map(c => '- ' + c.title + ' (' + STATUS[c.status] + (c.deadline ? ', deadline ' + c.deadline : '') + (c.aan ? ', ' + c.aan : '') + ')').join('\n') || '(geen)'}`;
  try {
    const r = await CAP.sample(sys + (prev ? '\n\nEERDER IN DIT GESPREK\n' + prev : '') + '\n\nVRAAG: ' + q, { cache: false, onText: ({ text }) => { msg.text = text; const el = document.getElementById('ai-msg-' + idx); if (el) { el.textContent = text; scroll(); } } });
    msg.text = r.text;
  } catch (e) { msg.text = e?.code === 'rate_limited' ? 'Even te veel verzoeken. Probeer het zo opnieuw.' : e?.code === 'not_granted' ? 'Claude mag in deze weergave niet worden gebruikt.' : 'Dat lukte niet. Probeer het opnieuw.'; }
  render(); requestAnimationFrame(scroll);
}

function palKeys(ev) {
  const p = S.palette;
  if (ev.key === 'ArrowDown') { ev.preventDefault(); p.active = Math.min(p.active + 1, p.entries.length - 1); renderPalette(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); p.active = Math.max(p.active - 1, 0); renderPalette(); }
  else if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); if (p.q.trim()) saveView(p.q.trim()); }
  else if (ev.key === 'Enter') { ev.preventDefault(); palPick(p.active); }
  else if (ev.key === 'Escape') { ev.preventDefault(); closePalette(); }
  else if (ev.key === 'Tab' && p.entries[p.active]?.kind === 'entity') { ev.preventDefault(); const inp = document.getElementById('pal-q'); inp.value = '@' + p.entries[p.active].id + ' '; p.q = inp.value; renderPalette(); }
}
function remember(q) { if (!q) return; S.recent = [q, ...S.recent.filter(x => x !== q)].slice(0, 6); store.set('recent2', S.recent); }
function palPick(i) {
  const en = S.palette.entries[i]; if (!en) return;
  const q = S.palette.q.trim();
  if (en.kind === 'query' || en.kind === 'recent') { const inp = document.getElementById('pal-q'); inp.value = en.q + ' '; S.palette.q = inp.value; S.palette.active = 0; renderPalette(); inp.focus(); return; }
  closePalette();
  if (en.kind === 'cmd') return en.c.run(en.arg);
  remember(q);
  if (en.kind === 'entity') return go({ view: 'entity', id: en.id });
  if (en.kind === 'ask') return ask(q);
  if (en.kind === 'all') return go({ view: 'list', q, title: 'Zoeken' });
  if (en.kind === 'item') return openItem(en.it.id, q);
}
function openItem(id, q) {
  if (q && S.route.view !== 'list') go({ view: 'list', q, title: 'Zoeken' });
  S.selected = id; renderInspector(); renderMainHighlights();
}
function saveView(q) {
  const p = parseQuery(q);
  const ent = p.entities.flatMap(matchEntityToken)[0] || p.text.flatMap(t => matchEntityToken(t))[0];
  const name = [p.types.map(t => SRC[t].plural).join(' + '), ent && ENT()[ent].short, ...p.is, p.when].filter(Boolean).join(' · ') || q;
  const v = { id: 'v-' + Date.now().toString(36), name: cap(name), q };
  S.saved.push(v); store.set('saved2', S.saved);
  closePalette(); toast(`${ic('bookmark')}View “${esc(v.name)}” bewaard`);
  go({ view: 'list', q, title: v.name, key: v.id, saved: true });
}

/* ---------- Render ---------- */
let renderQueued = false, mainDirty = false;
function scheduleRender() {
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const a = document.activeElement;
    if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#main')) { rebuild(); renderSidebar(); mainDirty = true; return; }
    render();
  });
}
document.addEventListener('focusout', () => { if (mainDirty) setTimeout(() => { const a = document.activeElement; if (!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#main'))) { mainDirty = false; render(); } }, 120); });
function renderMainHighlights() { document.querySelectorAll('#main [data-open]').forEach(el => el.classList.toggle('sel', el.dataset.open === S.selected)); }
function render() {
  rebuild();
  renderSidebar();
  const r = S.route, main = document.getElementById('main');
  const keepScroll = main.scrollTop;
  let html = '';
  if (r.view === 'dagstart') html = viewDagstart();
  else if (r.view === 'agenda') html = viewAgenda();
  else if (r.view === 'toezeggingen') html = viewToezeggingen();
  else if (r.view === 'entity') html = viewEntity(r.id);
  else if (r.view === 'list') html = viewList(r);
  else if (r.view === 'chat') html = viewChat();
  else if (r.view === 'wegschrijven') html = viewWegschrijven();
  main.classList.toggle('is-chat', r.view === 'chat');
  main.style.overflowY = r.view === 'chat' ? 'hidden' : '';
  main.innerHTML = topbar() + html;
  main.scrollTop = keepScroll;
  if (r.view === 'list') {
    renderListResults();
    const qb = document.getElementById('qbar');
    qb.addEventListener('input', () => { S.route.q = qb.value; renderListResults(); renderMainHighlights(); });
  }
  if (r.view === 'chat') { const m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight; }
  renderInspector(); renderMainHighlights();
  mainDirty = false;
}
let toastTimer;
function toast(html) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = html; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3600);
}

/* ---------- Events ---------- */
document.addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); S.palette ? closePalette() : openPalette(); }
  else if (ev.key === 'Escape' && S.sheet && !S.palette) closeSheet();
  else if (ev.key === 'Escape' && !S.palette && S.selected) { S.selected = null; renderInspector(); renderMainHighlights(); }
  else if (ev.key === '/' && !S.palette && !/input|textarea|select/i.test(document.activeElement.tagName)) { ev.preventDefault(); openPalette(); }
  if (ev.target.id === 'composer-input' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); ev.target.form.requestSubmit(); }
});
document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('a[href]')) return;
  const pi = t.closest('[data-pi]'); if (pi) { palPick(+pi.dataset.pi); return; }
  const cand = t.closest('[data-cand]'); if (cand) { S.sheet.items[+cand.dataset.cand].keep = cand.checked; const b = document.querySelector('[data-action="accept-cands"]'); if (b) b.textContent = `Toevoegen (${S.sheet.items.filter(x => x.keep).length})`; return; }
  const a = t.closest('[data-action]');
  if (a) {
    const act = a.dataset.action, id = a.dataset.id;
    if (act === 'close-pal') { if (t === a) closePalette(); return; }
    if (act === 'close-sheet') { if (t === a) closeSheet(); return; }
    if (act === 'close-sheet-btn') return closeSheet();
    if (act === 'accept-cands') return acceptCandidates();
    if (act === 'palette') return openPalette();
    if (act === 'palette-q') return openPalette(a.dataset.q);
    if (act === 'pal-save') return saveView(S.palette.q.trim());
    if (act === 'nav') return document.getElementById('app').classList.toggle('nav-open');
    if (act === 'close-insp') { S.selected = null; renderInspector(); renderMainHighlights(); return; }
    if (act === 'toast') return toast(esc(a.dataset.msg));
    if (act === 'ask') return ask(a.dataset.q);
    if (act === 'brief') return briefMe();
    if (act === 'week') { const dir = +a.dataset.dir; S.weekOffset = dir === 0 ? 0 : S.weekOffset + dir; return render(); }
    if (act === 'save-view') return saveView(S.route.q.trim());
    if (act === 'delete-view') { S.saved = S.saved.filter(v => v.id !== id); store.set('saved2', S.saved); go({ view: 'dagstart' }); return toast('View verwijderd'); }
    if (act === 'rsvp') return respondInvite(id, a.dataset.s);
    if (act === 't-done') return completeTask(id);
    if (act === 'c-done') { commitSave(id, { status: 'klaar', closedAt: today() }); return toast(`${ic('check')} Toezegging afgerond`); }
    if (act === 'c-reopen') return commitSave(id, { status: 'open', bewijs: null, closedAt: null });
    if (act === 'c-hand') { commitSave(id, { status: 'overgedragen', closedAt: today() }); return toast('Overgedragen aan Jira: de tracker laat hem los'); }
    if (act === 'c-del') return commitDelete(id);
    if (act === 'extract-scan') return runExtraction('scan');
    if (act === 'extract-m') return runExtraction('meeting', id);
    if (act === 'skip-m') { closeSheet(); return markProcessed(id); }
    if (act === 'sweep') return sweep();
    if (act === 'refresh') { CAP.mcp?.invalidate().catch(() => {}); return toast(`${ic('refresh')} Bronnen worden ververst`); }
    if (act === 'retry') { const e = ST[a.dataset.key]; if (e?.retry) { ST[a.dataset.key] = 'loading'; render(); e.retry(); } return; }
    if (act === 'src-err') { const s = sourceState(SOURCES[+a.dataset.i]); return toast(esc(errText(s.err))); }
  }
  const ent = t.closest('[data-entity]'); if (ent) { ev.stopPropagation(); go({ view: 'entity', id: ent.dataset.entity }); return; }
  const g = t.closest('[data-go]');
  if (g) {
    const k = g.dataset.go;
    if (k.startsWith('o-')) return go({ view: 'entity', id: k.slice(2) });
    location.hash === '#' + k ? (S.route = routeFromHash(), render()) : (location.hash = k);
    document.getElementById('app').classList.remove('nav-open');
    return;
  }
  const tab = t.closest('[data-ctab]'); if (tab) { S.commitTab = tab.dataset.ctab; return render(); }
  const o = t.closest('[data-open]'); if (o && o.dataset.open) return openItem(o.dataset.open);
  const ch = t.closest('[data-chat]'); if (ch) { S.chatChannel = ch.dataset.chat; return render(); }
  const co = t.closest('[data-chat-open]'); if (co) { S.chatChannel = co.dataset.chatOpen; S.selected = null; return go({ view: 'chat' }); }
  const md = t.closest('[data-mode]'); if (md) { S.chatChannel = md.dataset.mode === 'ai' ? 'ai' : 'all'; return render(); }
  if (document.getElementById('app').classList.contains('nav-open') && !t.closest('.sidebar')) document.getElementById('app').classList.remove('nav-open');
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'addcommit') {
    const wat = document.getElementById('ac-wat').value.trim(); if (!wat) return;
    commitAdd({ wat, stroom: document.getElementById('ac-stroom').value, deadline: document.getElementById('ac-date').value || null });
    S.commitTab = document.getElementById('ac-stroom').value;
    document.getElementById('ac-wat').value = ''; document.activeElement?.blur?.();
    toast(`${ic('commit')} Toezegging toegevoegd`);
    mainDirty = false; render();
  }
  if (ev.target.id === 'composer') { const inp = document.getElementById('composer-input'); const v = inp.value.trim(); if (v && S.chatChannel === 'ai') ask(v); }
});

S.route = routeFromHash();
boot();
</script>
