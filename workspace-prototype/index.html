<title>HomeZero Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: macOS-style three panes — sidebar (bronnen, views, partners) | werkvlak | contextpaneel. ⌘K-palet zweeft erboven. */
:root {
  --bg: #F4F6F3;
  --panel: #FFFFFF;
  --sidebar: #ECEFEA;
  --fg: #18211C;
  --muted: #59645D;
  --faint: #879189;
  --line: #DCE1DA;
  --hover: #E5E9E3;
  --accent: #1D6A4C;
  --accent-fg: #FFFFFF;
  --accent-soft: #DDEFE5;
  --warn: #A85A0B;
  --warn-soft: #FBEBD6;
  --add: #E3F4E8;
  --del: #FBE4E1;
  --c-mail: #C2410C;
  --c-slack: #7B3A82;
  --c-meeting: #2F5FD0;
  --c-context: #1D6A4C;
  --c-task: #A86B12;
  --c-file: #0E7490;
  --shadow: 0 24px 60px -12px rgba(20, 35, 27, .28), 0 0 0 1px rgba(20, 35, 27, .06);
  --font-ui: "Inter Variable", Inter, system-ui, sans-serif;
  --font-mono: "Inter Variable", Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412; --panel: #161B18; --sidebar: #0C0F0D; --fg: #E5EBE6; --muted: #9DA7A0; --faint: #6E7972;
    --line: #262E29; --hover: #1E2521; --accent: #5BC394; --accent-fg: #0C1410; --accent-soft: #183327;
    --warn: #F0A848; --warn-soft: #33250F; --add: #16301F; --del: #3A1C19;
    --c-mail: #F08A5D; --c-slack: #C98BD0; --c-meeting: #7FA2F2; --c-context: #5BC394; --c-task: #E4B355; --c-file: #4CC3DB;
    --shadow: 0 24px 60px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101412; --panel: #161B18; --sidebar: #0C0F0D; --fg: #E5EBE6; --muted: #9DA7A0; --faint: #6E7972;
  --line: #262E29; --hover: #1E2521; --accent: #5BC394; --accent-fg: #0C1410; --accent-soft: #183327;
  --warn: #F0A848; --warn-soft: #33250F; --add: #16301F; --del: #3A1C19;
  --c-mail: #F08A5D; --c-slack: #C98BD0; --c-meeting: #7FA2F2; --c-context: #5BC394; --c-task: #E4B355; --c-file: #4CC3DB;
  --shadow: 0 24px 60px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-size: 12px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* App shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }
.app.has-inspector { grid-template-columns: 236px minmax(0, 1fr) 360px; }

.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: 10px; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 14px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: -.02em; }
.brand b { font-weight: 600; font-size: 14px; }
.brand div span { display: block; font-size: 11px; color: var(--faint); }
.searchbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; color: var(--faint); margin-bottom: 14px; }
.searchbtn:hover { color: var(--muted); }
.searchbtn > span:not(.kbd) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.searchbtn .kbd { margin-left: auto; }
.kbd { font-family: var(--font-mono); font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--bg); line-height: 18px; }
.nav { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.nav-group { display: flex; flex-direction: column; gap: 1px; }
.nav-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 0 9px 4px; display: flex; justify-content: space-between; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 5px 9px; border-radius: 7px; color: var(--muted); text-align: left; width: 100%; }
.nav-item:hover { background: var(--hover); color: var(--fg); }
.nav-item.active { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--line); font-weight: 500; }
.nav-item .count { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav-item .count.hot { color: var(--warn); font-weight: 600; }
.nav-item .q { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); margin-left: auto; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sources { border-top: 1px solid var(--line); padding: 10px 9px 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--faint); }
.sources .sd { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.main { min-width: 0; min-height: 0; overflow-y: auto; background: var(--bg); }
.topbar { display: none; }
.page { padding-block: 26px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1180px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.eyebrow { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 2px 0 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); }

.inspector { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; padding-block: 18px 40px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Shared bits */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.card-body { padding: 12px 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.chip.entity { background: var(--accent-soft); color: var(--accent); font-weight: 500; cursor: pointer; }
.chip.entity:hover { filter: brightness(.97); }
.chip.warn { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.chip.ok { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip.plan { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; }
.src-mail { color: var(--c-mail); } .src-slack { color: var(--c-slack); } .src-meeting { color: var(--c-meeting); }
.src-context { color: var(--c-context); } .src-task { color: var(--c-task); } .src-file { color: var(--c-file); }
.ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--hover); }
.ic.mail { color: var(--c-mail); } .ic.slack { color: var(--c-slack); } .ic.meeting { color: var(--c-meeting); }
.ic.context { color: var(--c-context); } .ic.task { color: var(--c-task); } .ic.file { color: var(--c-file); }
.row { display: flex; align-items: flex-start; gap: 11px; padding: 9px 10px; border-radius: 9px; cursor: pointer; text-align: left; width: 100%; }
.row:hover, .row.sel { background: var(--hover); }
.row-main { min-width: 0; flex: 1; }
.row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-title.unread::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c-meeting); margin-right: 7px; vertical-align: 1px; }
.row-sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 1px; }
.list { display: flex; flex-direction: column; gap: 1px; }
.group-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 14px 10px 4px; display: flex; align-items: center; gap: 8px; }
.group-label:first-child { padding-top: 4px; }
.empty { color: var(--faint); padding: 20px 10px; text-align: center; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; color: #fff; }

/* Vandaag */
.banner { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--fg); margin-bottom: 18px; flex-wrap: wrap; }
.banner .ic { background: var(--panel); color: var(--warn); }
.banner .row-main { min-width: 200px; }
.timeline { position: relative; padding: 6px 14px 12px 58px; }
.tl-hour { position: relative; height: 46px; border-top: 1px solid var(--line); }
.tl-hour span { position: absolute; left: -46px; top: -8px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; width: 38px; text-align: right; }
.tl-event { position: absolute; left: 58px; right: 14px; border-radius: 8px; padding: 6px 10px; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 2px; border-left: 3px solid var(--c-meeting); background: color-mix(in srgb, var(--c-meeting) 10%, var(--panel)); }
.tl-event:hover { background: color-mix(in srgb, var(--c-meeting) 16%, var(--panel)); }
.tl-event.past { opacity: .78; }
.tl-event.short { flex-direction: row; align-items: center; gap: 10px; padding-block: 2px; }
.tl-event b { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-event .t { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.now-line { position: absolute; left: 50px; right: 6px; height: 0; border-top: 2px solid var(--c-mail); z-index: 2; }
.now-line::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--c-mail); }
.brief li { margin-bottom: 6px; }
.brief { margin: 0; padding-left: 18px; color: var(--fg); }

/* Agenda */
.week { display: grid; grid-template-columns: 48px repeat(5, minmax(120px, 1fr)); min-width: 680px; }
.week-wrap { overflow-x: auto; }
.wk-head { padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.wk-head b { display: block; font-size: 18px; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.wk-head.today b { color: var(--accent); }
.wk-col { position: relative; border-left: 1px solid var(--line); }
.wk-hours { position: relative; }
.wk-hl { height: 44px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--faint); text-align: right; padding-right: 6px; font-variant-numeric: tabular-nums; }
.wk-ev { position: absolute; left: 4px; right: 4px; border-radius: 7px; padding: 4px 7px; font-size: 12px; cursor: pointer; overflow: hidden; border-left: 3px solid var(--c-meeting); background: color-mix(in srgb, var(--c-meeting) 11%, var(--panel)); }
.wk-ev b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-ev .state { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.wk-ev.pending { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
.wk-ev.done { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Meeting page */
.meta-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
.people { display: flex; gap: 6px; flex-wrap: wrap; }
.person { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 9px 2px 2px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.person .avatar { width: 20px; height: 20px; font-size: 9px; }
.wb-section { padding: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.wb-section:first-child { border-top: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.check .who { color: var(--faint); font-size: 12px; white-space: nowrap; }
.diff { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.diff-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.diff pre { margin: 0; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.diff .ln { display: block; padding: 0 10px; white-space: pre; }
.diff .ln.add { background: var(--add); }
.diff .ln.del { background: var(--del); text-decoration: line-through; color: var(--muted); }
.diff .ln.ctx { color: var(--muted); }
.committed { display: flex; gap: 12px; align-items: center; padding: 14px; background: var(--accent-soft); border-radius: 12px; color: var(--fg); flex-wrap: wrap; }
.committed .ic { background: var(--panel); color: var(--accent); }
.answer-q { background: var(--bg); border-radius: 9px; padding: 9px 11px; font-size: 13px; }

/* Entity */
.entity-hero { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.entity-logo { width: 52px; height: 52px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 20px; font-weight: 700; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.facts dt { color: var(--faint); }
.facts dd { margin: 0; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.count-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
.count-pill b { font-variant-numeric: tabular-nums; }
.repo-path { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }

/* Chat */
.chat { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100%; min-height: 0; }
.chat-list { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 8px; background: var(--bg); }
.chat-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.chat-head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.msgs { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; max-width: 760px; }
.msg-body { min-width: 0; }
.msg-meta { font-size: 12px; color: var(--faint); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.msg-meta b { color: var(--fg); font-size: 13.5px; font-weight: 600; }
.msg-text { margin-top: 2px; overflow-wrap: anywhere; }
.msg.ai .avatar { background: var(--accent); color: var(--accent-fg); }
.msg.ai .msg-text { background: var(--accent-soft); padding: 10px 12px; border-radius: 4px 12px 12px 12px; }
.msg.ai .msg-text ul { margin: 6px 0; padding-left: 18px; }
.sources-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.composer { border-top: 1px solid var(--line); padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 8px; }
.composer-box { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; background: var(--bg); }
.composer-box textarea { flex: 1; border: 0; background: transparent; resize: none; outline: none; min-height: 22px; max-height: 120px; }
.seg { display: inline-flex; background: var(--hover); border-radius: 8px; padding: 2px; }
.seg button { padding: 3px 10px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }
.mention { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 3px; font-weight: 500; cursor: pointer; }

/* Query bar + list view */
.qbar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; margin-bottom: 16px; }
.qbar input { flex: 1; border: 0; outline: none; background: transparent; font-family: var(--font-mono); font-size: 13px; min-width: 0; }
.tok { font-family: var(--font-mono); font-size: 12px; }
.tok-key { color: var(--accent); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 14px; }

/* Activity */
.quickadd { display: flex; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; align-items: center; margin-bottom: 8px; }
.quickadd input { flex: 1; border: 0; outline: none; background: transparent; min-width: 0; }
.hint { font-size: 12px; color: var(--faint); margin: 0 0 18px; }

/* Inspector */
.insp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.insp-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 6px 0 4px; text-wrap: balance; }
.insp-body { white-space: pre-wrap; color: var(--fg); background: var(--bg); border-radius: 10px; padding: 12px; margin: 12px 0; font-size: 13px; overflow-wrap: anywhere; }
.insp-body.md { font-family: var(--font-mono); font-size: 12px; }
.insp-section { margin-top: 18px; }
.insp-section h2 { margin-bottom: 6px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.iconbtn { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { background: var(--hover); color: var(--fg); }

/* Palette */
.scrim { position: fixed; inset: 0; background: rgba(12, 20, 16, .32); z-index: 50; display: flex; justify-content: center; align-items: flex-start; padding-top: max(10vh, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.palette { width: 100%; max-width: 680px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 76vh; overflow: hidden; animation: pop .14s ease-out; }
@keyframes pop { from { transform: translateY(-6px) scale(.985); opacity: .4; } }
.pal-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.pal-input input { flex: 1; border: 0; outline: none; background: transparent; font-size: 16px; min-width: 0; }
.pal-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px 0; }
.pal-chips:empty { display: none; }
.pal-results { overflow-y: auto; padding: 6px 8px 8px; }
.pal-item { display: flex; gap: 11px; align-items: center; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.pal-item.active { background: var(--hover); }
.pal-item .row-main { min-width: 0; }
.pal-item .enter { margin-left: auto; opacity: 0; }
.pal-item.active .enter { opacity: 1; }
.pal-entity { margin: 4px 2px 6px; padding: 12px; border-radius: 11px; border: 1px solid var(--line); display: flex; gap: 12px; align-items: center; cursor: pointer; }
.pal-entity.active { border-color: var(--accent); background: var(--accent-soft); }
.pal-entity .entity-logo { width: 40px; height: 40px; font-size: 15px; border-radius: 10px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Dagstart, toezeggingen, live bronnen ---------- */
:root { --danger: #B42318; --danger-soft: #FBE7E4; --info: #2F5FD0; --info-soft: #E3EAFB; --c-commit: #6A4BC4; }

/* ---------- Toetsenbord, planning ---------- */

.hintbar { position: sticky; bottom: 0; margin-top: auto; z-index: 4; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; padding-block: 9px max(9px, env(safe-area-inset-bottom, 0px)); padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

.tab-kbd { margin-left: 6px; font-size: 10px; opacity: .6; }

/* ---------- Agenda, plansessie, briefing ---------- */

.wk-busy span { position: absolute; right: 4px; top: 2px; font-size: 10px; color: var(--muted); font-weight: 600; }
.wk-slot { position: absolute; left: 2px; right: 2px; border-radius: 7px; border: 2px dashed var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); z-index: 1; cursor: pointer; padding: 2px 4px; }
.wk-sel { position: absolute; left: 2px; right: 2px; border-radius: 7px; background: var(--accent); color: var(--accent-fg); z-index: 3; padding: 3px 7px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 0 6px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.18); pointer-events: none; }
.wk-col.picking { cursor: crosshair; }
.planner { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; border-color: var(--accent); }
.pl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pl-title { flex: 1; min-width: 200px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--bg); font-size: 14px; outline: none; }
.pl-title:focus, .pl-email:focus { border-color: var(--accent); }
#pl-dur { border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: var(--bg); }
.pl-people { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 3px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.pchip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 500; }
.pl-email { border: 1px dashed var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; background: transparent; outline: none; min-width: 170px; }
.pl-slots { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 28px; }
.slot { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; }
.slot.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: var(--grey-900); --panel: var(--grey-800); --sidebar: #0f1430; --fg: #ffffff; --muted: var(--grey-300); --faint: var(--grey-400);
  --line: var(--grey-750); --hover: #2a3157; --accent: var(--blue-350); --accent-fg: #ffffff; --accent-soft: #1c2a6b;
  --warn: var(--yellow-400); --warn-soft: #3a3214; --danger: #fe8171; --danger-soft: #3b1d1a; --info: var(--blue-350); --info-soft: #1c2a6b;
  --c-mail: var(--grey-300); --c-slack: var(--grey-300); --c-meeting: var(--blue-350); --c-context: var(--blue-350); --c-task: var(--grey-300); --c-file: var(--grey-300); --c-commit: var(--blue-350);
  --add: #12321f; --del: #3b1d1a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: var(--grey-900); --panel: var(--grey-800); --sidebar: #0f1430; --fg: #ffffff; --muted: var(--grey-300); --faint: var(--grey-400);
  --line: var(--grey-750); --hover: #2a3157; --accent: var(--blue-350); --accent-fg: #ffffff; --accent-soft: #1c2a6b;
  --warn: var(--yellow-400); --warn-soft: #3a3214; --danger: #fe8171; --danger-soft: #3b1d1a; --info: var(--blue-350); --info-soft: #1c2a6b;
  --c-mail: var(--grey-300); --c-slack: var(--grey-300); --c-meeting: var(--blue-350); --c-context: var(--blue-350); --c-task: var(--grey-300); --c-file: var(--grey-300); --c-commit: var(--blue-350);
  --add: #12321f; --del: #3b1d1a; color-scheme: dark; }
body { font-size: 14px; line-height: 1.5; }
.kbd { font-family: var(--font-ui); font-weight: 600; font-size: 10.5px; border-radius: 6px; background: var(--panel); }
.kbd.inv { background: transparent; color: inherit; border-color: currentColor; opacity: .8; }

/* Felt: grain over flat brand colour, shapes behind (zoals de website) */
.felt { position: relative; isolation: isolate; overflow: hidden; }
.felt::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: var(--grain-img) repeat; background-size: 256px 256px; mix-blend-mode: overlay; opacity: .8; }
.felt.felt-dark::after { opacity: .55; filter: contrast(1.5) brightness(1.03); }
.felt > .shapes { position: absolute; inset: 0; z-index: -2; pointer-events: none; }
.felt > .shapes svg { position: absolute; }
.plane-yellow { background: var(--yellow-500); color: var(--ink); }
.plane-yellow-light { background: var(--yellow-200); color: var(--ink); }
.plane-blue { background: var(--blue-500); color: #fff; }
.plane-blue-light { background: var(--blue-100); color: var(--ink); }
:root[data-theme="dark"] .plane-yellow-light, :root[data-theme="dark"] .plane-blue-light { color: var(--ink); }

/* Sidebar: papier, logo, rustige items */
.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); }
.brand { padding: 4px 8px 18px; }
.brand-logo { height: 24px; width: auto; display: block; }
:root[data-theme="dark"] .brand-logo { filter: brightness(0) invert(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-logo { filter: brightness(0) invert(1); } }
.brand span { font-size: 11px; color: var(--faint); }
.searchbtn { border-radius: var(--corner-s); border-color: var(--line); height: 38px; }
.nav { gap: 2px; }
.nav-item { padding: 8px 10px; border-radius: var(--corner-s); font-weight: 500; font-size: 14px; color: var(--muted); }
.nav-item.active { background: var(--panel); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.nav-item .count { font-weight: 600; color: var(--faint); }
.nav-item .count.hot { color: var(--ink); background: var(--yellow-500); border-radius: 999px; padding: 0 7px; }
.quiet-foot { border: 0; justify-content: flex-start; padding: 10px; }

/* Typografie: strak Inter zoals de site */
h1 { font-weight: 560; letter-spacing: -0.045em; line-height: 1.04; font-size: 40px; }
h2 { font-weight: 600; letter-spacing: -0.02em; font-size: 15px; }
h3 { letter-spacing: -0.02em; }
.eyebrow { letter-spacing: .02em; text-transform: none; font-size: 13px; font-weight: 500; color: var(--muted); }
.page { padding-block: 36px 72px; }

/* Knoppen: 8px hoek, label 14/600, geen schaduw */
.btn { height: 40px; padding: 0 16px; border-radius: var(--corner-s); border-color: var(--grey-200); font-weight: 600; font-size: 14px; background: var(--panel); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.primary { background: var(--blue-500); color: #fff; border-color: transparent; }
.btn.primary:hover { background: var(--blue-600); filter: none; }
.btn.yellow { background: var(--yellow-500); color: var(--ink); border-color: transparent; }
.btn.yellow:hover { background: var(--yellow-400); }
.btn.big { height: 48px; padding: 0 20px; }
.iconbtn { border-radius: var(--corner-s); }
.chip { border-radius: 999px; font-weight: 550; }
.chip.warn { background: var(--yellow-200); color: var(--ink); }
.chip.ok { background: var(--blue-100); color: var(--blue-500); }
:root[data-theme="dark"] .chip.ok { color: #fff; }
.chip.entity { background: var(--blue-50); color: var(--blue-500); border: 1px solid var(--blue-100); }
.card { border-radius: var(--corner-l); border-color: var(--line); }
.row { border-radius: var(--corner-m); }
.row:hover, .row.sel { background: var(--hover); }
.ic { border-radius: 10px; background: var(--grey-50); }
.kind { border-radius: 999px; padding: 1px 8px; font-size: 10.5px; letter-spacing: .02em; }
.k-reply, .k-invite, .k-prep, .k-commit { background: var(--blue-100); color: var(--blue-500); }
.k-late { background: var(--yellow-500); color: var(--ink); }
.k-task, .k-wait { background: var(--yellow-200); color: var(--ink); }
.st { border-radius: 999px; }
.st-te_laat { background: var(--yellow-500); color: var(--ink); }
.st-waarschijnlijk_klaar, .st-klaar { background: var(--blue-100); color: var(--blue-500); }
.capbar { background: var(--grey-100); height: 6px; border-radius: 999px; }
.capbar span { background: var(--blue-500); border-radius: 999px; }
.capbar.over span { background: var(--yellow-500); }
.toast { background: var(--grey-900); color: #fff; border-radius: var(--corner-m); box-shadow: var(--shadow); }
.palette { border-radius: var(--corner-xl); box-shadow: var(--shadow); }
.kf { outline-color: var(--blue-500) !important; }
:focus-visible { outline-color: var(--blue-500); }

/* ---------- Dagstart: rustig ---------- */
.calm { max-width: 1080px; }
.calm-head { border-radius: var(--corner-xxl); padding: 40px 44px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 220px; justify-content: flex-end; }
.calm-head .eyebrow { color: var(--grey-700); }
.calm-head h1 { font-size: 52px; letter-spacing: -0.05em; margin: 0; }
.calm-sum { margin: 4px 0 14px; font-size: 17px; line-height: 1.6; color: var(--grey-750); max-width: 60ch; }
.calm-sum b { color: var(--ink); font-weight: 650; }
.calm-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.calm-title { display: flex; align-items: center; gap: 10px; margin: 6px 0 8px; padding: 0 10px; }
.calm-title h2 { font-size: 20px; letter-spacing: -0.02em; margin: 0; }
.calm-more { margin-top: 18px; }
.calm-more > summary { cursor: pointer; list-style: none; padding: 8px 10px; font-weight: 600; color: var(--muted); font-size: 14px; }
.calm-more > summary::-webkit-details-marker { display: none; }
.calm-more > summary::after { content: " ›"; }
.calm-more[open] > summary::after { content: " ⌄"; }
.calm-foot { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
.calm-chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--grey-200); background: var(--panel); font-size: 13.5px; color: var(--fg); }
.calm-chip:hover { border-color: var(--grey-300); }
.calm-chip b { font-weight: 650; color: var(--blue-500); }
.cal-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.mini-agenda .ma-row { border-radius: var(--corner-m); padding: 9px 10px; }
.briefing-line { margin-bottom: 20px; border-radius: var(--corner-l); background: var(--panel); border: 1px solid var(--line); padding: 2px 16px; }
.briefing-line > summary { cursor: pointer; list-style: none; padding: 12px 0; font-weight: 600; }
.briefing-line > summary::-webkit-details-marker { display: none; }
.briefing-line .brief-grid { padding: 4px 0 16px; }
body:not(.kbd-mode) .hintbar { display: none; }
@media (max-width: 900px) { .calm-grid { grid-template-columns: minmax(0, 1fr); } .calm-head h1 { font-size: 38px; } .calm-head { padding: 28px 24px; } }

/* ---------- Planning & sprint ---------- */
.big-seg { background: var(--grey-50); border-radius: 999px; padding: 3px; }
.big-seg button { padding: 7px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; }
.big-seg button.on { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.calm-cols { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 24px; }
.plan-col.late .calm-title h2 { color: var(--warn); }
.sprint-goal { font-size: 17px; color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.sprintbar { display: flex; height: 14px; border-radius: 999px; background: var(--grey-100); overflow: hidden; }
.sprintbar span { height: 100%; }
.s-done { background: var(--blue-500); } .s-acc { background: var(--yellow-500); } .s-prog { background: var(--blue-200); }
.legend .lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; }
.jira-group { margin-bottom: 14px; }
.jira-group > summary { display: flex; align-items: baseline; gap: 6px; cursor: pointer; list-style: none; padding: 8px 10px; }
.jira-group > summary::-webkit-details-marker { display: none; }
.jira-group > summary h2 { font-size: 16px; margin: 0; }
.jira-row { align-items: center; text-decoration: none; color: inherit; }
.jkey { font-size: 12px; font-weight: 600; color: var(--blue-500); min-width: 74px; }

/* ---------- Plansessie: blauw vilt met de vormen van de site ---------- */
.scrim.sw-scrim { background: var(--blue-500); }
.scrim.sw-scrim::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--grain-img) repeat; background-size: 256px 256px; mix-blend-mode: overlay; opacity: .55; filter: contrast(1.5) brightness(1.03); }
.sw-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.sw-deco svg { position: absolute; }
.swipe { position: relative; z-index: 1; }
.sw-card { border-radius: var(--corner-xl); box-shadow: none; padding: 28px 28px 22px; }
.sw-title { font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
.sw-top { color: rgba(255,255,255,.86); }
.sw-prog { background: rgba(255,255,255,.2); } .sw-prog span { background: var(--yellow-500); }
.sw-key { border-radius: var(--corner-s); border-color: var(--grey-200); font-weight: 550; }
.sw-key:hover { border-color: var(--blue-500); background: var(--blue-50); }
.sw-end .btn.primary { background: var(--yellow-500); color: var(--ink); }

/* ---------- Agenda (kleuren blijven die van Google) ---------- */
.gweek { grid-template-columns: 52px repeat(7, minmax(108px, 1fr)) !important; min-width: 860px; }
.wk-head { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: center; }
.wk-head b { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; text-transform: none; }
.wk-head.today b { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--blue-500); color: #fff; }
.wk-head.wknd { color: var(--faint); }
.wk-ev.g { background: var(--ev); color: #fff; border: 0; border-radius: 6px; padding: 3px 7px; }
.wk-ev.g b { font-weight: 600; }
.wk-ev.g .state { color: rgba(255,255,255,.88); }
.wk-ev.g.inv { background: var(--panel); color: var(--ev); border: 1.5px solid var(--ev); }
.wk-ev.g.inv .state { color: var(--ev); }
.wk-ev.g.quiet { background: var(--ev); }
.ad-ev { background: var(--ev) !important; color: #fff; border-radius: 5px !important; font-weight: 600; border: 0 !important; }
.ad-task { font-size: 11px; background: var(--panel) !important; color: var(--blue-500); border: 1px solid var(--blue-100); border-radius: 5px; padding: 1px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.layer-btn.on { box-shadow: none; }

/* v6 polish */
.wk-ev { box-sizing: border-box; }
.wk-head.today b { display: grid; margin: 2px auto 0; }
.briefing-line > summary { display: flex; align-items: center; gap: 8px; }
.briefing-line > summary svg { width: 16px; height: 16px; color: var(--yellow-500); }
:root[data-theme="dark"] .calm-chip b { color: var(--blue-350); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .calm-chip b { color: var(--blue-350); } }

:root[data-theme="dark"] .ic { background: var(--hover); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ic { background: var(--hover); } }

const watching = new Set();
function watch(key, server, tool, input, onData, interval = 300000) {
  const id = key + JSON.stringify(input);
  if (watching.has(id)) return; watching.add(id);
  ST[key] = 'loading';
  const retry = () => CAP.mcp.callTool(server, tool, input).then(r => { onData(r.payload); ST[key] = 'ok'; LV.updated[key] = Date.now(); scheduleRender(); })
    .catch(e => { ST[key] = { code: e?.code || 'upstream_error', message: e?.message || '', server, retry }; scheduleRender(); });
  CAP.mcp.watchTool(server, tool, input, ev => {
    if (ev.type === 'data') {
      try { onData(ev.result.payload); ST[key] = 'ok'; LV.updated[key] = ev.result.cache?.storedAt || Date.now(); }
      catch (e) { console.error(key, e); ST[key] = { code: 'parse', message: 'Onverwacht antwoord van ' + server, server, retry }; }
    } else {
      const c = ev.error?.code || 'upstream_error';
      if (DENY.includes(c)) { try { onData(null); } catch {} }
      ST[key] = { code: c, message: ev.error?.message || '', server, retry };
    }
    scheduleRender();
  }, { cache: { staleTime: 60000, gcTime: 900000 }, refetchInterval: interval });
}

function parseSlack(payload) {

    const g = re => (p.match(re) || [])[1];
    const chan = p.match(/^Channel: (.+?) \(ID: (\w+)\)/m) || [];
    const from = p.match(/^From: (.*?)(?: <([^>]+)>)? \(ID: (\w+)\)(.*)$/m) || [];
    const ts = g(/^Message_ts: ([\d.]+)/m);
    const timeStr = g(/^Time: (.+)$/m);
    const parts = g(/^Participants: (.+)$/m) || '';
    const others = [...parts.matchAll(/([^,(]+?) \(ID: (\w+)\)/g)].filter(m => m[2] !== SLACK_ME).map(m => m[1].trim());

    const isDm = /^DM/.test(chan[1] || '') || /^Group/.test(chan[1] || '');
    return {
      ts, channelId: chan[2], channelName: isDm ? 'DM ' + (others.join(', ') || from[1] || '') : (chan[1] || ''), dm: isDm,
      fromName: (from[1] || '').trim() || 'Slack', fromId: from[3], bot: /\[BOT\]/.test(from[4] || ''),
      time: time ? time.toISOString() : null, url: g(/^Permalink: \[link\]\((.+?)\)/m), thread: /thread_ts=/.test(g(/^Permalink: \[link\]\((.+?)\)/m) || ''),

}

}

  // op een weekenddag tellen taken van vandaag t/m de eerstvolgende werkdag mee voor 'Vandaag'
  const lo = date === ymd(baseDay()) ? today() : date;
  const inRange = d => d && d >= lo && d <= date;
  return allItems().filter(it => !isDone(it) && ((it.type === 'task' && !it.backlog && inRange(it.due)) || (it.type === 'commit' && !it.linkedTask && ['mijn', 'voornemen'].includes(it.stroom) && inRange(it.plan))));
}
const loadOf = date => plannedOn(date).length;
function bucketDate(n) {
  const b = baseDay();
  if (n === 1) return ymd(b);
  const tm = nextWork(b);
  if (n === 2) return ymd(tm);
  const least = days => days.map(ymd).sort((a, c) => (loadOf(a) >= DAY_CAP) - (loadOf(c) >= DAY_CAP) || loadOf(a) - loadOf(c) || a.localeCompare(c))[0];
  const wkB = weekStart(0, b);
  if (n === 3) {
    const later = [2, 3, 4].map(i => addDays(wkB, i)).filter(d => d > tm);
    return least(later.length ? later : [addDays(wkB, 7), addDays(wkB, 8)]);

  return least([0, 1, 2, 3, 4].map(i => addDays(wkB, 7 + i)));
}
function bucketOf(date, backlog) {
  if (backlog) return 5;

  const b = ymd(baseDay()), tm = ymd(nextWork(baseDay()));
  if (date < today()) return -1;
  if (date <= b) return 1;
  if (date === tm) return 2;
  const wkB = weekStart(0, baseDay());

}

function kindOf(it) {

  if (it.type === 'mail') return 'reply';
  if (it.type === 'task') return 'task';
  if (it.type === 'commit') return it.stroom === 'aan_mij' ? 'waiting' : it.stroom === 'bespreken' ? 'bespreken' : 'commit';

function slackToAnswer() {

function inbox() {
  const T = today(), out = [];
  const add = (kind, it, score, why) => out.push({ kind, it, score, why });
  const horizon = ymd(addWorkdays(S.clock, 2));
  for (const it of allItems()) {
    if (it.type === 'slack' && !it.read && !it.fromMe && !it.bot) {
      if (it.mega) add('mega', it, 70, `📣 Door jou gemarkeerd · ${it.channel}`);
      else if (!it.answered && (it.dm || it.mention)) { const ageH = (S.clock - when(it)) / 36e5; add('reply', it, (it.dm ? 72 : 64) + (/\?/.test(it.title) ? 6 : 0) - Math.min(14, ageH / 12), `${it.dm ? 'DM' : 'Noemt je in ' + it.channel} · ${it.fromName} · ${dayLabel(when(it))} ${hm(when(it))}`); }
    }
    if (it.type === 'mail' && it.direct && !it.read) add('reply', it, 62, `Mail aan jou · ${it.fromName}`);
    if (it.type === 'task' && !it.backlog && !it.commitId && (!it.due || it.due < T)) add('task', it, it.due ? 66 + Math.min(10, -dayDiff(pd(it.due))) : 36, it.due ? `Google Tasks · over tijd sinds ${fmtDate(it.due)}${it.moved >= 2 ? ' · ' + it.moved + 'e keer doorgeschoven' : ''}` : 'Google Tasks · nog geen datum');
    if (it.type === 'commit' && !isDone(it)) {
      if (['mijn', 'voornemen'].includes(it.stroom)) {
        if (it.status === 'waarschijnlijk_klaar') add('commit', it, 50, `Bewijs gevonden: ${it.raw.bewijs || ''} · bevestig met x`);
        else if (it.status === 'te_laat' && !(it.plan >= T)) add('commit', it, 90, `${STROOM[it.stroom]}${it.aan ? ' · ' + it.aan : ''} · deadline was ${fmtDate(it.deadline)}`);
        else if (!it.backlog && (!it.plan || it.plan < T)) add('commit', it, it.plan ? 68 : 46, `${STROOM[it.stroom]}${it.aan ? ' · ' + it.aan : ''}${it.plan ? ' · stond op ' + fmtDate(it.plan) : ' · nog niet gepland'}${it.moved >= 2 ? ' · ' + it.moved + 'e keer doorgeschoven' : ''}`);
      } else if (it.stroom === 'aan_mij' && !it.backlog && it.reminder && it.reminder <= T) add('waiting', it, 58, `Wachten op ${it.aan || 'iemand'} sinds ${fmtDate(it.raw.created || it.reminder)} · nog geen reactie, nudge?`);
    }
    if (it.type === 'meeting' && pd(it.end || it.start) > S.clock) {
      if (it.needsAction) add('invite', it, 74 - Math.min(7, Math.max(0, dayDiff(pd(it.start)))) * 3, `Uitnodiging van ${it.organizerName || 'onbekend'} · ${dayLabel(pd(it.start))}${it.allDay ? '' : ' ' + hm(pd(it.start))}`);
      else if (it.external && !it.prepTask && !it.skipPrep && ymd(pd(it.start)) <= horizon) add('prep', it, 68 - Math.max(0, dayDiff(pd(it.start))) * 4, `Extern · ${dayLabel(pd(it.start))} ${hm(pd(it.start))} · nog geen prep gepland`);
    }
    if (it.type === 'rec' && !it.processed && !it.recapSession && pd(it.end) < S.clock && dayDiff(pd(it.start)) >= -7) add('process', it, (it.entities.length ? 60 : 44) - Math.min(10, -dayDiff(pd(it.start))), `Opname ${dayLabel(pd(it.start)).toLowerCase()}${it.recapDone ? ' · recap staat in #klanten' : it.entities.length ? ' · nog geen recap' : ''}`);
  }
  return out.sort((a, b) => b.score - a.score);
}

const KIND = { late: ['k-late', 'Te laat'], commit: ['k-commit', 'Toezegging'], prep: ['k-prep', 'Prep'], invite: ['k-invite', 'Uitnodiging'], reply: ['k-reply', 'Reageren'], mega: ['k-reply', '📣 To-do'],
  task: ['k-task', 'Taak'], process: ['k-process', 'Verwerken'], waiting: ['k-wait', 'Wachten op'], bespreken: ['k-prep', 'Bespreken'], meeting: ['k-process', 'Meeting'], other: ['k-process', ''] };
function focusDay() {
  const evs = allItems().filter(i => i.type === 'meeting' && !i.allDay && !i.ooo);
  for (let k = 0; k < 8; k++) {
    const day = ymd(addDays(S.clock, k));
    const list = evs.filter(e => ymd(pd(e.start)) === day && (k > 0 || pd(e.end) > S.clock));
    if (list.length) return { day, k, list: evs.filter(e => ymd(pd(e.start)) === day).sort((a, b) => when(a) - when(b)) };
  }

}

/* ---------- Query engine (⌘K en views) ---------- */
const TYPE_ALIAS = { mail: 'mail', email: 'mail', inbox: 'mail', slack: 'slack', chat: 'slack', meeting: 'meeting', meetings: 'meeting', afspraak: 'meeting', agenda: 'meeting',
  context: 'context', wispr: 'rec', opname: 'rec', rec: 'rec', taak: 'task', taken: 'task', task: 'task', commit: 'commit', toezegging: 'commit', toezeggingen: 'commit', commitments: 'commit', drive: 'file' };

  for (const raw of q.trim().split(/\s+/).filter(Boolean)) {
    const tok = raw.toLowerCase(); let m;
    if (tok.startsWith('@') && tok.length > 1) out.entities.push(tok.slice(1));
    else if ((m = tok.match(/^(type|bron|from|van|in|when|wanneer|is|org|partner):(.+)$/))) {
      const [, k, v] = m;
      if (k === 'type' || k === 'bron') { const t = TYPE_ALIAS[v]; if (t) out.types.push(t); }
      else if (k === 'from' || k === 'van') out.from.push(v);
      else if (k === 'in') out.in.push(v);
      else if (k === 'when' || k === 'wanneer') out.when = v;
      else if (k === 'is') out.is.push(v);

}

}

}
function runQuery(q) {
  const p = parseQuery(q);
  const entIds = p.entities.flatMap(matchEntityToken);
  const res = allItems().filter(it => {
    if (p.types.length && !p.types.includes(it.type)) return false;
    if (p.entities.length && !(it.entities || []).some(e => entIds.includes(e))) return false;
    if (p.from.length && !p.from.some(f => String(it.fromName || it.organizerName || it.aan || '').toLowerCase().includes(f))) return false;
    if (p.in.length && !(it.channel && p.in.some(c => it.channel.toLowerCase().includes(c.replace(/^#/, ''))))) return false;
    if (p.when) {
      if (it.nodate) return false;
      const diff = dayDiff(when(it));
      if ((p.when === 'vandaag' || p.when === 'today') && diff !== 0) return false;
      if (p.when === 'morgen' && diff !== 1) return false;
      if ((p.when === 'week' || p.when === 'deze-week') && (diff < -6 || diff > 6)) return false;
      if (p.when === 'gisteren' && diff !== -1) return false;
      if (p.when === 'komend' && when(it) < S.clock) return false;
    }
    for (const f of p.is) {
      if (f === 'open' && (it.type === 'commit' ? ['klaar', 'overgedragen'].includes(it.status) : it.type === 'task' ? false : !(it.unread || it.needsAction))) return false;
      if (f === 'unread' && !it.unread) return false;
      if (f === 'direct' && !it.direct) return false;
      if (f === 'invite' && !it.needsAction) return false;
      if (f === 'extern' && !it.external) return false;
      if (f === 'reageren' && !((it.type === 'slack' && !it.fromMe && !it.answered && !it.bot && !it.read && (it.dm || it.mention)) || (it.type === 'mail' && it.direct && !it.read))) return false;
      if (STATUS[f] && it.status !== f) return false;
      if (STROOM[f] && it.stroom !== f) return false;
    }
    if (p.text.length) { const h = haystack(it); if (!p.text.every(w => h.includes(w))) return false; }
    return true;
  });
  res.sort((a, b) => (a.nodate - b.nodate) || when(b) - when(a));
  const entityHits = [...new Set([...entIds, ...p.text.flatMap(t => t.length >= 3 ? matchEntityToken(t) : [])])];
  return { items: res, entityHits, parsed: p };
}
function grouped(items) { const g = {}; for (const it of items) (g[it.type] ||= []).push(it); return TYPE_ORDER.filter(t => g[t]).map(t => [t, g[t]]); }
function queryChips(q) {
  return q.trim().split(/\s+/).filter(Boolean).map(t => {

/* ---------- Dagstart: rustig, alleen wat vandaag telt ---------- */
function greeting() {
  const h = S.clock.getHours();
  const away = S.lastSeen && Date.now() - S.lastSeen > 10 * 36e5;
  if (away || !S.lastSeen) return 'Welkom terug, Robert';
  return (h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond') + ', Robert';
}
function capBar(n) { const pct = Math.min(100, n / DAY_CAP * 100); return `<span class="capbar${n > DAY_CAP ? ' over' : ''}" title="${n} van ${DAY_CAP}"><span style="width:${pct}%"></span></span>`; }
function errorsOnly() {
  if (!MODE.live) return '';

  return bad.length ? `<div class="note err" style="margin-bottom:16px">${bad.map(([src, s]) => esc(errText(s.err))).join('<br>')}</div>` : '';

/* ---------- Planning: mijn planning en de sprint ---------- */
function viewPlanning() {

/* ---------- Jira-sprint ---------- */
const JIRA_GROUPS = [['mine', 'Voor jou om te testen'], ['accept', 'Ready to Accept'], ['review', 'In review'], ['progress', 'In progress'], ['todo', 'To do'], ['done', 'Klaar']];
function jiraGroup(i) {
  const st = (i.status || '').toLowerCase();
  if (i.mine && /ready to accept/.test(st)) return 'mine';
  if (i.cat === 'done') return 'done';
  if (/ready to accept/.test(st)) return 'accept';
  if (/review/.test(st)) return 'review';
  if (i.cat === 'indeterminate') return 'progress';
  return 'todo';
}
function sprintInfo() {
  const issues = LV.jira || []; if (!issues.length) return null;
  const sp = issues.map(i => i.sprint).find(Boolean); if (!sp) return null;
  const end = pd(sp.endDate), start = pd(sp.startDate);
  const pts = g => issues.filter(g).reduce((s, i) => s + (i.sp || 0), 0);
  return { ...sp, end, start, daysLeft: Math.max(0, Math.ceil((startOfDay(end) - startOfDay(S.clock)) / 864e5)), totalPts: pts(() => true), donePts: pts(i => i.cat === 'done'),
    acceptPts: pts(i => /ready to accept/i.test(i.status)), progPts: pts(i => i.cat === 'indeterminate' && !/ready to accept/i.test(i.status)), mine: issues.filter(i => jiraGroup(i) === 'mine').length, count: issues.length };
}
function viewSprint(tabs) {
  const info = sprintInfo();
  const issues = LV.jira || [];
  const head = `<div class="page-head"><div><h1>${info ? esc(info.name) : 'Sprint'}</h1>${info ? `<div class="sub" style="margin-top:4px">${fmtDate(ymd(info.start))} – ${fmtDate(ymd(info.end))} · nog ${info.daysLeft} ${info.daysLeft === 1 ? 'dag' : 'dagen'}</div>` : ''}</div>${tabs}</div>`;
  if (!issues.length) return `<div class="page">${head}${sectionNote(['jira'])}<div class="empty">${MODE.live ? 'Geen open sprint gevonden in HOM.' : 'De sprint verschijnt hier zodra de pagina live in claude.ai draait.'}</div></div>`;
  const tot = Math.max(1, info.totalPts);
  const bar = `<div class="sprintbar"><span class="s-done" style="width:${info.donePts / tot * 100}%"></span><span class="s-acc" style="width:${info.acceptPts / tot * 100}%"></span><span class="s-prog" style="width:${info.progPts / tot * 100}%"></span></div>
    <div class="legend" style="margin:6px 0 18px"><span><i class="lg s-done"></i>klaar ${info.donePts}</span><span><i class="lg s-acc"></i>te accepteren ${info.acceptPts}</span><span><i class="lg s-prog"></i>bezig ${info.progPts}</span><span>totaal ${info.totalPts} pt · ${info.count} stories</span></div>`;
  const goal = info.goal ? `<p class="sprint-goal">${esc(info.goal.split('\n')[0].replace(/^Sprintdoel:\s*/i, ''))}</p>` : '';
  const groups = JIRA_GROUPS.map(([g, label]) => [g, label, issues.filter(i => jiraGroup(i) === g)]).filter(([, , l]) => l.length);
  return `<div class="page">${head}${sectionNote(['jira'])}${goal}${bar}
    ${groups.map(([g, label, list]) => `<details class="jira-group"${g !== 'done' ? ' open' : ''}><summary><h2>${label}</h2><span class="count-badge">${list.length}</span></summary><div class="list">${list.map(i => `<a class="row jira-row" href="${esc(i.url)}" target="_blank" rel="noopener" data-k="${esc(i.id)}" data-kind="jira"><span class="jkey">${esc(i.key)}</span><span class="row-main"><span class="row-title" style="display:block">${esc(i.title)}</span><span class="row-sub" style="display:block">${esc(i.status)}${i.assignee ? ' · ' + esc(i.assignee) : ''}</span></span>${i.sp ? `<span class="chip">${i.sp} pt</span>` : ''}${i.assignee ? avatar(i.assignee, 22) : ''}</a>`).join('')}</div></details>`).join('')}
    <p class="hint">Testen doe je in je vaste Testen-blok. <span class="kbd">o</span> opent in Jira · <span class="kbd">v</span> terug naar je planning</p></div>`;
}

          ${it.stroom === 'aan_mij' ? `<span>sinds ${it.raw.created ? fmtDate(it.raw.created) : '–'}${it.reminder ? ` · reminder <b style="${it.reminder <= today() ? 'color:var(--danger)' : ''}">${fmtDate(it.reminder)}</b>` : ''}</span>` : it.stroom === 'bespreken' ? '' : `<span>${it.backlog ? 'backlog' : it.plan ? 'gepland ' + fmtDate(it.plan) : 'nog niet gepland'}${it.deadline ? ` · deadline <b style="${it.status === 'te_laat' ? 'color:var(--danger)' : ''}">${fmtDate(it.deadline)}</b>` : ''}${it.linkedTask ? ' · in Google Tasks' : ''}</span>`}

      <div class="commit-acts">${isDone(it) ? `<button class="btn sm" data-action="c-reopen" data-id="${esc(it.docId)}">${ic('undo')}Heropen</button>` : `

/* ---------- Plansessie: kaart voor kaart (swipe) ---------- */
const HEALTH = { groen: ['🟢', 'Op koers'], oranje: ['🟠', 'Risico'], rood: ['🔴', 'Blokkade'], af: ['✅', 'Af'] };
function goalDue(c) {
  const T = today(), last = c.raw.lastCheck;
  if (c.stroom === 'weekdoel') return last !== T;
  return !last || dayDiff(pd(last)) <= -7 || (['oranje', 'rood'].includes(c.raw.health) && last !== T);
}
function swipeQueue() {
  const goals = openCommits().filter(c => ['weekdoel', 'roadmap'].includes(c.stroom) && goalDue(c))
    .sort((a, b) => (a.stroom === 'weekdoel' ? 0 : 1) - (b.stroom === 'weekdoel' ? 0 : 1))
    .map(c => ({ id: c.id, kind: 'goal', why: c.stroom === 'weekdoel' ? `Weekdoel${c.raw.week ? ' ' + c.raw.week : ''} · hoe staat het ervoor?` : 'Roadmap · wekelijkse check' }));
  return [...goals, ...inbox().map(b => ({ id: b.it.id, kind: b.kind, why: b.why }))];
}
function startSwipe() {
  const q = swipeQueue();
  if (!q.length) return toast('Niets te plannen. Alles heeft een plek.');
  S.swipe = { q, i: 0, done: 0, anim: '' };
  S.help = false; S.selected = null; renderInspector();
  renderSwipe();
}

async function swipeKey(k) {
  const sw = S.swipe; const cur = swipeCurrent();
  if (k === 'Escape') return stopSwipe();
  if (!cur) { if (k === 'p') { stopSwipe(); go({ view: 'planning' }); } return; }
  const it = cur.it;
  const next = (dir = 'left', counted = true) => { if (counted) sw.done++; sw.i++; sw.anim = 'in-' + dir; const el = document.getElementById('sw-card'); if (el && !matchMedia('(prefers-reduced-motion: reduce)').matches) { el.classList.add('out-' + dir); setTimeout(renderSwipe, 160); } else renderSwipe(); };
  if (k === 's' || k === 'ArrowRight') return next('left', false);
  if (k === 'u' || k === 'ArrowLeft') { if (sw.i > 0) { sw.i--; sw.anim = 'in-right'; renderSwipe(); } return; }
  if (k === 'o') { if (it.url) { let w = null; try { w = window.open(it.url, '_blank', 'noopener'); } catch {} if (!w) toast(`<a href="${esc(it.url)}" target="_blank" rel="noopener" style="color:inherit">Openen ${ic('out')}</a>`); } return; }
  if (cur.kind === 'goal') {
    const note = document.getElementById('sw-note')?.value.trim() || '';
    if (k === 'n') { document.getElementById('sw-note')?.focus(); return; }
    const h = { g: 'groen', o: 'oranje', r: 'rood', x: 'af' }[k];
    if (!h) return;
    const T = today();
    const patch = { health: h, lastCheck: T, checks: [...(it.raw.checks || []).filter(c => c.d !== T).slice(-19), { d: T, h, note }] };
    if (h === 'af') Object.assign(patch, { status: 'klaar', closedAt: T });
    await commitSave(it.docId, patch);
    toast(`${HEALTH[h][0]} ${esc(short(it.title, 50))}: ${HEALTH[h][1].toLowerCase()}`);
    return next(h === 'rood' || h === 'oranje' ? 'down' : 'left');
  }
  const map = { x: 'x', e: 'e', E: 'E', w: 'w', b: 'b', c: 'c', r: 'r', t: 't', y: 'y', m: 'm', n: 'n' };
  if (/^[1-5]$/.test(k) || map[k]) {
    if (['y', 'm', 'n'].includes(k) && !(it.type === 'meeting' && it.needsAction)) return;
    const ok = await keyAction(k, null, it);
    if (ok !== false) next(/^[1-2]$/.test(k) ? 'up' : /^[3-5]$/.test(k) ? 'right' : 'left');
  }
}

/* ---------- Weekdoelen ophalen uit #02-intern ---------- */
const CH_INTERN = 'C056FUDC00L';
const isoWeek = dt => { const t = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate() + 3 - ((dt.getDay() + 6) % 7))); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 4)); return `${t.getUTCFullYear()}-W${String(1 + Math.round(((t - y) / 864e5 - 3 + ((y.getUTCDay() + 6) % 7)) / 7)).padStart(2, '0')}`; };
async function importWeekgoals() {
  if (!MODE.live) return toast('Demo: weekdoelen ophalen werkt alleen live.');
  S.busy.goals = true; render();
  try {
    const res = await call('Slack', 'slack_search_public_and_private', { keywords: ['"Nieuwe week"'], filters: `in:<#${CH_INTERN}> after:${ymd(addDays(S.clock, -8))}`, include_bots: true, limit: 3, response_format: 'detailed', include_context: false, sort: 'timestamp', natural_language_query: '' });
    const hit = parseSlack(res).find(m => /Nieuwe week/i.test(m.text));
    if (!hit) throw { code: 'geen weekdoelen-thread gevonden' };
    const th = await call('Slack', 'slack_read_thread', { channel_id: CH_INTERN, message_ts: hit.ts, response_format: 'concise', limit: 100 });
    const txt = typeof th === 'string' ? th : (th?.messages || JSON.stringify(th || ''));
    const mine = String(txt).split(/\n> /).find(p => /^Robert Verveen\b/.test(p) && /\n?\s*1[.)]\s/.test(p));
    if (!mine) throw { code: 'nog geen reply van jou in de thread' };
    const goals = mine.slice(mine.indexOf(':') + 1).split('\n').map(l => (l.match(/^\s*\d+[.)]\s+(.+)/) || [])[1]).filter(Boolean).map(cleanSlack);
    const tdate = pd(hit.time);
    const wkStart = tdate.getDay() === 0 ? addDays(startOfDay(tdate), 1) : weekStart(0, tdate);
    const week = isoWeek(wkStart), friday = ymd(addDays(wkStart, 4));
    const have = new Set(LV.commits.filter(c => c.stroom === 'weekdoel' && c.week === week).map(c => normOrg(c.wat).slice(0, 50)));
    let n = 0;
    for (const g of goals) { if (have.has(normOrg(g).slice(0, 50))) continue; await commitAdd({ wat: g, stroom: 'weekdoel', week, deadline: friday, bron: { label: `Weekdoelen ${week} · #02-intern`, url: hit.url } }); n++; }
    toast(n ? `🎯 ${n} weekdoelen voor ${week} overgenomen` : `Weekdoelen ${week} stonden er al`);
  } catch (e) { toast(`Weekdoelen ophalen lukte niet (${esc(e?.code || 'fout')}).`); }
  delete S.busy.goals; render();
}

function layoutLanes(list) {
  const out = new Map(); let cluster = [], end = 0;
  const flush = () => { const cols = []; for (const m of cluster) { let c = cols.findIndex(t => t <= pd(m.start)); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = pd(m.end); out.set(m, { lane: c }); } cluster.forEach(m => out.get(m).lanes = cols.length); cluster = []; };
  for (const m of list) { if (cluster.length && pd(m.start) >= end) flush(); cluster.push(m); end = Math.max(end, +pd(m.end)); }
  if (cluster.length) flush();
  return out;
}

/* Inplannen met collega's: beschikbaarheid, voorstellen van Google, klik in het raster om zelf een tijd te kiezen */
function plannerPeople() {
  const self = LV.selfEmail || 'robert@homezero.nl';
  const fromCals = LV.calendars.filter(c => /@homezero\.nl$/i.test(c.id) && c.id.toLowerCase() !== self).map(c => c.id.toLowerCase());
  const fromEvents = AGENDA_EVENTS.flatMap(e => (e.attendees || []).map(a => a.email)).filter(e => /@homezero\.nl$/i.test(e) && e !== self);
  return [...new Set([...fromCals, ...fromEvents])].sort();
}
function openPlanner() {
  if (S.route.view !== 'agenda') go({ view: 'agenda' });
  S.planner = S.planner || { title: '', dur: 30, people: [], meet: true, slots: [], sel: null, loading: false };
  render(); setTimeout(() => document.getElementById('pl-title')?.focus(), 30);
}
async function plannerSuggest() {
  const P = S.planner; if (!P) return;
  P.slots = []; P.err = null;
  if (!P.people.length) return render();
  if (!MODE.live) { P.slots = demoSlots(P.dur); return render(); }
  for (const e of P.people) if (LV.calendars.some(c => c.id.toLowerCase() === e)) ensureCalRange(agendaBase(), 7, true, e);
  P.loading = true; render();
  const base = agendaBase(), from = pd(localISO(base)) < S.clock ? S.clock : base;
  try {
    const p = await call('Google Calendar', 'suggest_time', { attendeeEmails: [LV.selfEmail || 'robert@homezero.nl', ...P.people], startTime: localISO(from), endTime: localISO(addDays(base, 4)).slice(0, 11) + '17:30:00', durationMinutes: P.dur, preferences: { startHour: '08:30', endHour: '17:30', excludeWeekends: true, pageSize: 6 } });
    P.slots = (p?.timeSlots || []).map(s => ({ start: pd(s.startTime || s.start?.dateTime), free: s.durationMinutes })).filter(s => s.start && !isNaN(s.start));
  } catch (e) { P.err = `Voorstellen ophalen lukte niet (${e?.code || 'fout'}). Klik zelf een tijd in het raster.`; }
  P.loading = false; render();
}
function demoSlots(dur) { const b = agendaBase(); return [[0, 10, 30], [1, 14, 0], [2, 9, 0], [3, 16, 0]].map(([d, h, m]) => ({ start: new Date(addDays(b, d).setHours(h, m)), free: dur + 30 })); }
function plannerPick(start) { const P = S.planner; if (!P) return; P.sel = { start, end: new Date(+start + P.dur * 6e4) }; render(); }
async function plannerSend() {
  const P = S.planner; if (!P?.sel) return toast('Kies eerst een tijd (1–6 of klik in het raster)');
  const title = P.title.trim() || 'Overleg';
  if (!MODE.live) { toast(`Demo: uitnodiging “${esc(title)}” zou naar ${P.people.length} ${P.people.length === 1 ? 'collega' : 'collega’s'} gaan`); S.planner = null; return render(); }
  P.sending = true; render();
  try {
    await call('Google Calendar', 'create_event', { summary: title, startTime: localISO(P.sel.start), endTime: localISO(P.sel.end), attendees: P.people.map(email => ({ email })), addGoogleMeetUrl: !!P.meet, description: 'Ingepland via de Home Zero Workspace.' });
    toast(`${ic('meeting')} Uitnodiging verstuurd: ${esc(title)}, ${dayLabel(P.sel.start).toLowerCase()} ${hm(P.sel.start)}`);
    S.planner = null; await CAP.mcp.invalidate('Google Calendar').catch(() => {});
  } catch (e) { P.sending = false; toast(`Versturen lukte niet (${esc(e?.code || 'fout')}). Er is niets verstuurd als Google een fout gaf; controleer anders je agenda.`); }
  render();
}

function viewAgenda() {
  const base = agendaBase();
  if (MODE.live && LV.calendars.length) ensureCalRange(base, 7, true);
  const days = Array.from({ length: 7 }, (_, i) => addDays(base, i));
  const evs = AGENDA_EVENTS;
  const P = S.planner;
  const busy = P?.people.length ? Object.values(LV.ranges).filter(r => P.people.includes(String(r.calId).toLowerCase())).flatMap(r => (r.events || []).map(e => ({ calId: r.calId, start: e.start?.dateTime, end: e.end?.dateTime, title: e.summary, transparent: e.transparency === 'transparent' }))).filter(e => e.start && !e.transparent) : [];
  const weekEvs = [...evs.filter(e => !e.allDay), ...busy].filter(e => days.some(d => ymd(pd(e.start)) === ymd(d)));
  const H0 = Math.min(8, ...weekEvs.map(e => pd(e.start).getHours()));
  const H1 = Math.max(19, ...weekEvs.map(e => { const t = pd(e.end); return Math.min(24, (t.getHours() + (t.getMinutes() ? 1 : 0)) || 24); }));
  const PX = 44; S.agendaGrid = { H0, PX };
  const oc = openCommits();
  const wk = isoWeek(base).split('-W')[1];
  const pos = (s, e) => { const top = ((s.getHours() + s.getMinutes() / 60) - H0) * PX; const endH = ymd(e) !== ymd(s) ? 24 : e.getHours() + e.getMinutes() / 60; return { top, h: Math.max((endH - (s.getHours() + s.getMinutes() / 60)) * PX - 2, 16) }; };
  return `<div class="page">${modeBanner()}
    <div class="page-head" style="margin-bottom:12px"><div><div class="eyebrow">Google Agenda · week ${wk} · Nederlandse tijd</div><h1>${days[0].getDate()} ${days[0].getMonth() !== days[6].getMonth() ? MONTHS[days[0].getMonth()].slice(0, 3) + ' ' : ''}– ${days[6].getDate()} ${MONTHS[days[6].getMonth()]}</h1></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="iconbtn" data-action="week" data-dir="-1" aria-label="Vorige week">${ic('chevL')}</button><button class="btn sm" data-action="week" data-dir="0">Deze week</button><button class="iconbtn" data-action="week" data-dir="1" aria-label="Volgende week">${ic('chevR')}</button>
      </div></div>
    ${layerBar()}${plannerCard()}
    ${sectionNote(Object.keys(ST).filter(k => k.startsWith('cal')).slice(0, 3))}
    <div class="card week-wrap"><div class="week gweek">
      <div class="wk-head"></div>${days.map(dt => `<div class="wk-head${ymd(dt) === today() ? ' today' : ''}${[0, 6].includes(dt.getDay()) ? ' wknd' : ''}">${DAYS[dt.getDay()].slice(0, 2)}<b>${dt.getDate()}</b></div>`).join('')}
      <div class="wk-allday" style="border-right:0"></div>${days.map(dt => `<div class="wk-allday" style="border-left:1px solid var(--line)">${evs.filter(e => e.allDay && ymd(pd(e.start)) <= ymd(dt) && ymd(dt) < ymd(pd(e.end))).map(e => `<span class="ad-ev" data-open="${esc(e.id)}" title="${esc(e.title)} · ${esc(e.calName || '')}" style="--ev:${evColor(e)}">${esc(e.title)}</span>`).join('')}${allItems().filter(t => t.type === 'task' && !t.backlog && t.due === ymd(dt)).map(t => `<span class="ad-task" data-open="${esc(t.id)}" title="Google Tasks: ${esc(t.title)}">◯ ${esc(t.title)}</span>`).join('')}</div>`).join('')}
      <div class="wk-hours">${Array.from({ length: H1 - H0 }, (_, i) => `<div class="wk-hl">${String(H0 + i).padStart(2, '0')}:00</div>`).join('')}</div>
      ${days.map(dt => {
        const list = evs.filter(e => !e.allDay && ymd(pd(e.start)) === ymd(dt)).sort((a, b) => when(a) - when(b) || pd(b.end) - pd(a.end));
        const lanes = layoutLanes(list);
        const dayBusy = busy.filter(b => ymd(pd(b.start)) === ymd(dt));
        const slots = P ? P.slots.filter(s => ymd(s.start) === ymd(dt)) : [];
        return `<div class="wk-col${P ? ' picking' : ''}" data-date="${ymd(dt)}">${Array.from({ length: H1 - H0 }, () => '<div class="wk-hl"></div>').join('')}
          ${dayBusy.map(b => { const { top, h } = pos(pd(b.start), pd(b.end)); return `<div class="wk-busy" style="top:${top}px;height:${h}px" title="${esc(nameFromEmail(b.calId))}: bezet ${hm(pd(b.start))}–${hm(pd(b.end))}"><span>${esc(initialsOf(nameFromEmail(b.calId)))}</span></div>`; }).join('')}
          ${slots.map(s => { const { top, h } = pos(s.start, new Date(+s.start + P.dur * 6e4)); return `<div class="wk-slot" style="top:${top}px;height:${h}px" data-action="planner-slot" data-i="${P.slots.indexOf(s)}"><span class="kbd">${P.slots.indexOf(s) + 1}</span></div>`; }).join('')}
          ${list.map(m => {
            const s = pd(m.start), e = pd(m.end); const { top, h } = pos(s, e);
            const { lane, lanes: n } = lanes.get(m);
            const nOpen = m.agendaOnly ? 0 : oc.filter(c => c.entities.some(x => m.entities.includes(x))).length;
            const col = evColor(m);
            const cls = [m.needsAction ? 'inv' : '', m.ooo ? 'ooo' : '', m.agendaOnly ? 'quiet' : ''].join(' ');
            return `<div class="wk-ev g ${cls}" data-open="${esc(m.id)}" data-k="${esc(m.id)}" data-kind="${kindOf(m)}" style="top:${top}px;height:${h}px;left:calc(${(lane / n) * 100}% + 2px);width:calc(${100 / n}% - 4px);right:auto;--ev:${col}" title="${esc(m.title)} · ${hm(s)}–${hm(e)} · ${esc(m.calName || '')}"><b>${m.external ? '● ' : ''}${esc(m.title)}</b>${h > 38 ? `<span class="state">${hm(s)}–${hm(e)}${m.external ? ' · ' + esc(m.entities.map(entityName).join(', ')) : ''}${nOpen ? ` · <b style="display:inline">${nOpen} open</b>` : ''}</span>` : ''}</div>`;
          }).join('')}
          ${P?.sel && ymd(P.sel.start) === ymd(dt) ? (() => { const { top, h } = pos(P.sel.start, P.sel.end); return `<div class="wk-sel" style="top:${top}px;height:${h}px"><b>${esc(P.title || 'Nieuw overleg')}</b><span>${hm(P.sel.start)}–${hm(P.sel.end)}</span></div>`; })() : ''}
          ${ymd(dt) === today() && S.clock.getHours() >= H0 && S.clock.getHours() < H1 ? `<div class="now-line" style="left:0;right:0;top:${((S.clock.getHours() + S.clock.getMinutes() / 60) - H0) * PX}px"></div>` : ''}</div>`;
      }).join('')}
    </div></div>
    <p class="hint" style="margin-top:12px"><span class="kbd">l</span> lagen · <span class="kbd">n</span> inplannen met collega's · <span class="kbd">[</span> <span class="kbd">]</span> week · Lou en collega's zie je alleen hier, niet in Dagstart of zoeken (aan te passen per laag).</p></div>`;
}

function aiMessages() {
  if (!S.aiThread.length) {
    const sugg = ['Wat moet ik vandaag nog beantwoorden?', 'Welke toezeggingen lopen het meeste risico?', 'Waar moet ik op letten bij mijn externe afspraken deze week?'];
    return `<div class="msg ai"><span class="avatar">${ic('spark')}</span><div class="msg-body"><div class="msg-meta"><b>Claude</b></div><div class="msg-text">Ik kijk mee in je agenda, ongelezen mail, Slack, taken en toezeggingen. Waar wil je meer over weten?<div class="sources-row">${sugg.map(s => `<button class="btn sm" data-action="ask" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div></div></div>`;
  }
  return S.aiThread.map((m, i) => m.role === 'user'
    ? `<div class="msg">${avatar('Robert Verveen')}<div class="msg-body"><div class="msg-meta"><b>Jij</b></div><div class="msg-text">${esc(m.text)}</div></div></div>`
    : `<div class="msg ai"><span class="avatar">${ic('spark')}</span><div class="msg-body"><div class="msg-meta"><b>Claude</b>${m.demo ? '<span class="demo-tag">voorbeeld</span>' : ''}</div><div class="msg-text" id="ai-msg-${i}" style="white-space:pre-wrap">${esc(m.text) || 'Denkt na…'}</div></div></div>`).join('');
}
function contextDump() {
  const lines = allItems().filter(i => !i.nodate || i.type === 'mail').slice(0, 160).map(i => `[${SRC[i.type].label}${i.time || i.start ? ' ' + ymd(when(i)) + ' ' + hm(when(i)) : ''}] ${short(i.title, 300)} — ${short(itemSub(i), 160)}${i.entities?.length ? ' (' + i.entities.map(entityName).join(', ') + ')' : ''}`);
  return lines.join('\n');
}
async function ask(q) {
  S.chatChannel = 'ai';
  S.aiThread.push({ role: 'user', text: q });
  const msg = { role: 'ai', text: '' }; S.aiThread.push(msg);
  if (S.route.view !== 'chat') go({ view: 'chat' }); else render();
  const scroll = () => { const m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight; };
  requestAnimationFrame(scroll);
  if (!CAP.sample) { msg.demo = true; msg.text = 'In de live versie beantwoordt Claude dit op basis van je agenda, mail, Slack, taken en toezeggingen. Open de pagina in claude.ai om het te proberen.'; return render(); }
  const idx = S.aiThread.length - 1;
  const prev = S.aiThread.slice(0, -2).slice(-4).map(m => (m.role === 'user' ? 'Robert: ' : 'Claude: ') + m.text).join('\n');
  const sys = `Je bent de werkassistent van Robert Verveen (productmanager bij Home Zero). Beantwoord zijn vraag kort en concreet in het Nederlands, alleen op basis van de gegevens hieronder. Noem bronnen bij naam (bijv. "Slack, DM Mike" of "mail van Rens"). Zeg het eerlijk als iets er niet in staat. Nu: ${longDay(S.clock)} ${hm(S.clock)}.\n\nGEGEVENS\n${contextDump()}\n\nOPEN TOEZEGGINGEN\n${openCommits().map(c => '- ' + c.title + ' (' + STATUS[c.status] + (c.deadline ? ', deadline ' + c.deadline : '') + (c.aan ? ', ' + c.aan : '') + ')').join('\n') || '(geen)'}`;
  try {
    const r = await CAP.sample(sys + (prev ? '\n\nEERDER IN DIT GESPREK\n' + prev : '') + '\n\nVRAAG: ' + q, { cache: false, onText: ({ text }) => { msg.text = text; const el = document.getElementById('ai-msg-' + idx); if (el) { el.textContent = text; scroll(); } } });
    msg.text = r.text;
  } catch (e) { msg.text = e?.code === 'rate_limited' ? 'Even te veel verzoeken. Probeer het zo opnieuw.' : e?.code === 'not_granted' ? 'Claude mag in deze weergave niet worden gebruikt.' : 'Dat lukte niet. Probeer het opnieuw.'; }
  render(); requestAnimationFrame(scroll);
}

function renderInspector() {
  const el = document.getElementById('inspector'), app = document.getElementById('app');
  const it = S.selected && byId(S.selected);
  if (!it) { el.hidden = true; app.classList.remove('has-inspector'); return; }
  el.hidden = false; app.classList.add('has-inspector');
  const rel = related(it.entities || [], it.id, 8);
  let meta = '', body = '', actions = '', extra = '';
  if (it.type === 'meeting') {
    meta = it.allDay ? `${cap(longDay(pd(it.start)))} · hele dag` : `${cap(longDay(pd(it.start)))} · ${hm(pd(it.start))}–${hm(pd(it.end))}${it.where ? ' · ' + esc(short(it.where, 40)) : ''}`;
    actions = (it.needsAction ? (S.busy[it.id] ? '<span class="sub">Bezig…</span>' : `<button class="btn sm primary" data-action="rsvp" data-id="${esc(it.id)}" data-s="accepted">Accepteer</button><button class="btn sm" data-action="rsvp" data-id="${esc(it.id)}" data-s="tentative">Misschien</button><button class="btn sm" data-action="rsvp" data-id="${esc(it.id)}" data-s="declined">Afwijzen</button>`) : '') + extLink(it.meet, ic('out') + 'Meet') + extLink(it.url, ic('out') + 'Google Agenda');
    const oc = openCommits().filter(c => c.entities.some(e => it.entities.includes(e)));
    if (it.attendees?.length) extra += `<div class="insp-section"><h2>Deelnemers <span class="count-badge">${it.attendees.length}</span></h2>${it.attendees.slice(0, 14).map(a => `<div class="att"><span>${esc(a.name)}${a.self ? ' (jij)' : ''}${a.organizer ? ' · organisator' : ''}</span><span class="rs ${a.status}">${({ accepted: 'ja', declined: 'nee', tentative: 'misschien', needsAction: 'geen reactie' })[a.status] || ''}</span></div>`).join('')}</div>`;
    else if (it.attendeeNames?.length) extra += `<div class="insp-section"><h2>Deelnemers</h2><div class="people">${it.attendeeNames.map(n => `<span class="person">${avatar(n, 20)}${esc(n)}</span>`).join('')}</div></div>`;
    if (it.entities.length) extra += `<div class="insp-section"><h2>${ic('commit')} Open toezeggingen bij ${esc(it.entities.map(entityName).join(', '))}</h2>${oc.length ? `<div class="list">${oc.map(rowHTML).join('')}</div>` : '<div class="note">Niets open. Mooi.</div>'}</div>`;
    if (it.desc) body = it.desc;
    if (it.external) {
      const bs = openCommits().filter(c => c.stroom === 'bespreken' && c.entities.some(e => it.entities.includes(e)));
      if (bs.length) extra += `<div class="insp-section"><h2>Bespreken bij dit contact</h2><div class="list">${bs.map(c => rowHTML(c)).join('')}</div></div>`;
      extra += `<div class="insp-section"><h2>Voorbereiding en recap</h2><div class="note">${it.prepTask ? '✅ Prep staat gepland.' : it.skipPrep ? 'Geen prep nodig.' : '⚠️ Nog geen prep gepland. Druk 1–4 om een prep-taak te maken.'}${isPast(it) ? `<br>${it.recapDone ? '✓ Recap staat in #04-klanten.' : it.recapSession ? 'Recap-sessie met Claude loopt.' : 'Nog geen recap.'}` : ''}</div><div class="actions"><button class="btn sm" data-action="recap" data-id="${esc(it.id)}">${ic('spark')}Recap met Claude <span class="kbd">r</span></button></div></div>`;
    }
  } else if (it.type === 'mail') {
    meta = `${esc(it.fromName)}${it.fromEmail ? ' · ' + esc(it.fromEmail) : ''}${it.direct ? ' · aan jou' : ' · cc'}`;
    body = it.body || ''; actions = extLink(it.url, ic('out') + 'Open in Gmail') + `<button class="btn sm" data-action="item" data-key="e">Gelezen <span class="kbd">e</span></button><button class="btn sm" data-action="item" data-key="w">Wachten op <span class="kbd">w</span></button>` + `<span class="plan-btns">${[1,2,3,4,5].map(n => `<button class="btn sm" data-action="plan" data-id="${esc(it.id)}" data-n="${n}" title="${BUCKETS[n]}"><span class="kbd">${n}</span>${n === 1 ? 'Vandaag' : n === 2 ? 'Morgen' : n === 3 ? 'Later' : n === 4 ? 'Volg. week' : 'Backlog'}</button>`).join('')}</span>`;
  } else if (it.type === 'slack') {
    meta = `${esc(it.channel)} · ${esc(it.fromMe ? 'jij' : it.fromName)}${it.time ? ' · ' + dayLabel(when(it)) + ' ' + hm(when(it)) : ''}`;
    body = it.title; actions = extLink(it.url, ic('out') + 'Open in Slack') + `<button class="btn sm" data-action="item" data-key="e">Gelezen <span class="kbd">e</span></button><button class="btn sm" data-action="item" data-key="E">✅ in Slack <span class="kbd">⇧E</span></button><button class="btn sm" data-action="item" data-key="w">Wachten op <span class="kbd">w</span></button>` + `<span class="plan-btns">${[1,2,3,4,5].map(n => `<button class="btn sm" data-action="plan" data-id="${esc(it.id)}" data-n="${n}" title="${BUCKETS[n]}"><span class="kbd">${n}</span>${n === 1 ? 'Vandaag' : n === 2 ? 'Morgen' : n === 3 ? 'Later' : n === 4 ? 'Volg. week' : 'Backlog'}</button>`).join('')}</span>`;
  } else if (it.type === 'task') {
    meta = `Google Tasks${it.list ? ' · ' + esc(it.list) : ''} · ${it.backlog ? 'backlog' : it.due ? 'gepland ' + fmtDate(it.due) : 'geen datum'}${it.moved >= 2 ? ' · ' + it.moved + 'e keer doorgeschoven' : ''}`;
    body = it.notes || '';
    actions = S.busy[it.id] ? '<span class="sub">Bezig…</span>' : `<button class="btn sm primary" data-action="t-done" data-id="${esc(it.id)}">${ic('check')}Afvinken <span class="kbd">x</span></button>` + extLink(it.url, ic('out') + 'Google Tasks') + `<span class="plan-btns">${[1,2,3,4,5].map(n => `<button class="btn sm" data-action="plan" data-id="${esc(it.id)}" data-n="${n}" title="${BUCKETS[n]}"><span class="kbd">${n}</span>${n === 1 ? 'Vandaag' : n === 2 ? 'Morgen' : n === 3 ? 'Later' : n === 4 ? 'Volg. week' : 'Backlog'}</button>`).join('')}</span>`;
  } else if (it.type === 'commit') {
    const c = it.raw;
    meta = `${STROOM[c.stroom] || ''}${c.aan ? ' · ' + esc(c.aan) : ''}${c.deadline ? ' · deadline ' + fmtDate(c.deadline) : ''}`;
    body = [c.citaat ? '“' + c.citaat + '”' : '', c.bron?.label ? 'Bron: ' + c.bron.label : '', c.bewijs ? 'Bewijs: ' + c.bewijs : (c.bewijsregel?.type && c.bewijsregel.type !== 'geen' ? `Bewijsregel: ${c.bewijsregel.type}${c.bewijsregel.to ? ' → ' + c.bewijsregel.to : ''}${c.bewijsregel.keywords?.length ? ' · ' + c.bewijsregel.keywords.join(', ') : ''}` : 'Geen bewijsregel: dit vink je zelf af.')].filter(Boolean).join('\n\n');

    meta = `${cap(longDay(pd(it.start)))} · ${hm(pd(it.start))} · ${esc((it.attendeeNames || []).slice(0, 5).join(', '))}`;
    body = it.body || '';
    actions = `<button class="btn sm primary" data-action="recap" data-id="${esc(it.id)}">${ic('spark')}Recap met Claude <span class="kbd">r</span></button><button class="btn sm" data-action="extract-m" data-id="${esc(it.rawId)}">Toezeggingen eruit <span class="kbd">t</span></button>` + extLink(it.url, ic('out') + 'Wispr');

  } else if (it.type === 'jira') {
    meta = `${esc(it.key)} · ${esc(it.status)}${it.assignee ? ' · ' + esc(it.assignee) : ''}${it.sp ? ' · ' + it.sp + ' pt' : ''}${it.mine ? ' · jij test' : ''}`;
    actions = extLink(it.url, ic('out') + 'Open in Jira');
  } else if (it.type === 'context') { meta = 'Contextlaag · voorbeeld'; body = it.body; }
  el.innerHTML = `<div class="insp-head">${srcLabel(it.type)}<button class="iconbtn" data-action="close-insp" aria-label="Sluiten">${ic('x')}</button></div>

}
